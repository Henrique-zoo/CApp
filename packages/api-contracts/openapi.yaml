openapi: 3.1.0

info:
  title: CApp API
  version: 4.1.0
  description: |
    Contrato das rotas atualmente implementadas no backend CApp.
    Os caminhos são servidos sem prefixo /v1.
    Desde 2.0.0, rotas de negócio exigem X-Firebase-AppCheck além do Firebase
    ID token. O servidor verifica assinatura, emissor, audiência, validade e
    App ID permitido. app_check_required e app_check_invalid retornam 403;
    app_check_unavailable retorna 503. /health e /ready dispensam ambos os tokens.
    Desde 3.0.0, POST /auth/institutional/verify retorna user e verification
    no mesmo envelope.
    Desde 4.0.0, o vínculo student exige curso institucional não vazio e o
    perfil interno não aceita courseName declarado pelo usuário. O e-mail do Graph
    é retornado apenas como suggestedEmail durante o cadastro, fora da evidência
    institucional, e não é persistido. Contas ativas preservam o e-mail escolhido.
    A partir de 4.1.0, as leituras do quadro eleitoral e de seu checkpoint são públicas.

    A verificação institucional valida um Firebase ID token e um Microsoft access
    token da mesma pessoa, consulta a instituição pelo tenant Microsoft, verifica
    a participação no grupo estudantil e persiste a evidência por 120 dias.
    Estudantes e não estudantes podem concluir a verificação. Ela provisiona
    uma conta interna incompleta por UID Firebase, sem criar credenciais ou conceder permissões
    específicas de curso. A expiração informada é da evidência institucional,
    independente da expiração do ID token Firebase.

tags:
  - name: Infraestrutura
    description: Saúde do processo e comunicação com PostgreSQL.
  - name: Identidade
    description: Verificação das credenciais e do vínculo institucional.
  - name: Eleições
    description: Distribuição de evidências para verificação pelos eleitores e autoridades.
  - name: Consultas e Enquetes
    description: Consultas e enquetes estudantis organizadas pelo Centro Acadêmico.

paths:
  /elections/{id}/board:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoard
      tags: [Eleições]
      summary: Exportar o quadro eleitoral público
      description: Retorna uma única fotografia confirmada, com os registros em ordem de aceite.
      security: []
      responses:
        "200":
          description: Evidências públicas do protocolo eleitoral v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionBoardSnapshot"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/board/checkpoint:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoardCheckpoint
      tags: [Eleições]
      summary: Obter a âncora atual do quadro
      description: Guardar fora do servidor para comparar com uma exportação posterior da mesma eleição.
      security: []
      responses:
        "200":
          description: Último recibo assinado, ou o manifesto assinado quando o quadro está vazio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionEvidence"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/receipts/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getOwnElectionReceipt
      tags: [Eleições]
      summary: Recuperar o recibo original da conta autenticada
      description: Aceita a consulta depois do encerramento e da expiração da elegibilidade eleitoral.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Recibo assinado e persistido quando a cédula foi aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionEvidence"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Conta ainda não provisionada ou sem recibo nessa eleição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Falha interna ao resolver a conta ou o recibo.
        "503":
          description: Não foi possível autenticar ou ler o armazenamento.

  /health:
    get:
      operationId: getHealth
      tags: [Infraestrutura]
      summary: Verificar se o servidor responde
      description: Não consulta PostgreSQL, Firebase ou Microsoft Graph.
      security: []
      responses:
        "200":
          description: O processo HTTP está respondendo.
          content:
            text/plain:
              schema:
                type: string
                const: O servidor está saudável.
              example: O servidor está saudável.

  /ready:
    get:
      operationId: getReadiness
      tags: [Infraestrutura]
      summary: Verificar a comunicação com PostgreSQL
      description: |
        Executa SELECT 1 AS ok, com limite total de dois segundos para aquisição
        da conexão e execução. Não verifica tabelas, versão do esquema ou
        disponibilidade dos provedores de autenticação. As respostas não têm corpo.
      security: []
      responses:
        "200":
          description: Consulta ao PostgreSQL concluída.
        "503":
          description: Erro de comunicação com PostgreSQL ou tempo limite excedido.

  /auth/institutional/verify:
    post:
      operationId: verifyInstitutionalIdentity
      tags: [Identidade]
      summary: Criar ou renovar a verificação institucional
      description: |
        Exige um Firebase ID token no cabeçalho Authorization e um Microsoft
        access token delegado no corpo. A identidade Microsoft vinculada ao ID
        token deve corresponder ao perfil obtido no Graph.

        O backend consulta a organização Microsoft, busca a instituição cadastrada
        pelo tenant e usa o grupo dessa instituição em me/checkMemberGroups.
        A ausência de participação no grupo ou de curso não vazio no Graph resulta
        em affiliation.type=nonStudent, sem rejeitar a autenticação. A entrada é
        limitada e não concede direitos de estudante em nenhum CA. jobTitle é
        interpretado como curso somente quando o grupo foi confirmado. Nome pode
        estar ausente e é serializado como null. Curso ausente,
        nulo ou em branco nunca é substituído por informação declarada pelo usuário.
        O e-mail do Graph só é retornado em suggestedEmail se a conta estiver
        incompleta e o endereço estiver disponível. Ele apenas sugere o e-mail do
        formulário, não integra verification, não é persistido e não altera o e-mail
        escolhido em verificações posteriores.

        A resposta inclui user com a conta provisionada e verification com a evidência,
        dispensando GET /auth/session após esta operação. verification inclui institution com o identificador interno, o nome e a
        sigla do cadastro institucional do CApp. A sigla pode ser null. Esse resumo
        não expõe tenant ou grupo Microsoft e não concede permissões nem comprova,
        por si só, vínculo estudantil; o vínculo está em profile.affiliation.

        Não exige uma verificação institucional anterior. O serviço tem timeout
        total de 15 segundos; o cancelamento não garante desfazer uma gravação
        já concluída. Após confrontar as identidades, provisiona uma conta incompleta
        de forma idempotente, preservando o ID, o perfil e o status de contas existentes.
        Não reativa contas inativas. Perfil e credencial interna são concluídos separadamente.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        description: Credencial Microsoft da mesma identidade vinculada ao Firebase.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionalAuthRequest"
            examples:
              institutionalAuthRequest:
                summary: Requisição de verificação institucional
                externalValue: ./examples/institutional-auth-request.json
      responses:
        "200":
          description: Identidade verificada e evidência institucional persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalAuthResponse"
              examples:
                student:
                  summary: Estudante com curso informado pelo diretório
                  externalValue: ./examples/institutional-verification-student.json
                studentWithoutOptionalData:
                  summary: Estudante com curso informado, nome e e-mail nulos e instituição sem sigla
                  externalValue: ./examples/institutional-verification-student-null-fields.json
                nonStudent:
                  summary: Pessoa sem participação no grupo estudantil
                  externalValue: ./examples/institutional-verification-non-student.json
        "400":
          description: |
            bad_request — JSON ausente, malformado, de tipo incompatível ou
            rejeitado pelo extractor (inclusive Content-Type inadequado ou limite
            de corpo excedido); microsoftAccessToken ausente, null ou vazio.
            Todas essas rejeições são normalizadas para HTTP 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Requisição inválida
                  details: null
        "401":
          description: |
            Credenciais inválidas. Códigos possíveis:
            - unauthorized: Authorization ausente, repetido ou Bearer malformado;
            - invalid_token: credencial rejeitada pelo verificador ou pelo Graph;
            - expired_token: ID token Firebase expirado;
            - invalid_microsoft_id: identificador Microsoft vinculado ausente ou inválido;
            - identity_mismatch: ID token e perfil Microsoft representam pessoas diferentes.
          headers:
            WWW-Authenticate:
              description: Desafio Bearer incluído em todas as respostas 401.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: Autenticação necessária
                      details: null
                invalidToken:
                  value:
                    error:
                      code: invalid_token
                      message: Token de autenticação inválido
                      details: null
                expiredToken:
                  value:
                    error:
                      code: expired_token
                      message: Token de autenticação expirado
                      details: null
                invalidMicrosoftId:
                  value:
                    error:
                      code: invalid_microsoft_id
                      message: Identificador Microsoft ausente ou inválido
                      details: null
                identityMismatch:
                  value:
                    error:
                      code: identity_mismatch
                      message: As identidades autenticadas não correspondem
                      details: null
        "403":
          description: |
            app_check_required ou app_check_invalid — comprovação do aplicativo ausente ou recusada.
            unknown_institution — o tenant Microsoft não corresponde a uma
            instituição cadastrada.
            account_inactive — a conta interna foi desativada e não é reativada pelo login.
            institutional_verification_required — uma verificação concorrente com
            início igual ou posterior já foi persistida para o mesmo UID e esta
            tentativa não a substituiu; repita a verificação institucional.
            Não confirmar o grupo estudantil ou o curso não gera esses erros; a resposta
            é 200 com o vínculo nonStudent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unknownInstitution:
                  externalValue: ./examples/api-error-unknown-institution.json
                concurrentVerification:
                  value:
                    error:
                      code: institutional_verification_required
                      message: É necessário verificar novamente seu vínculo institucional.
                      details: null
        "500":
          description: internal_server_error — falha interna, inclusive de persistência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_server_error
                  message: Erro interno do servidor
                  details: null
        "503":
          description: |
            app_check_unavailable — não foi possível obter chaves válidas do App Check.
            authentication_provider_unavailable — falha de comunicação, resposta
            inesperada ou indisponibilidade de Firebase/JWKS ou Microsoft Graph.
            service_unavailable — timeout total de 15 segundos do serviço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                providerUnavailable:
                  value:
                    error:
                      code: authentication_provider_unavailable
                      message: Serviço de autenticação temporariamente indisponível
                      details: null
                timeout:
                  value:
                    error:
                      code: service_unavailable
                      message: Serviço temporariamente indisponível
                      details: null


  /auth/session:
    get:
      operationId: restoreAccountSession
      tags: [Identidade]
      summary: Restaurar a conta interna e a confirmação institucional vigente
      description: |
        Valida o ID token Firebase e consulta a conta provisionada. Não consulta o
        Graph nem exige access token Microsoft. verification é null quando a evidência
        expirou ou sua configuração institucional mudou; o perfil interno é preservado.
        Uma conta incompleta também pode restaurar sua sessão para concluir o cadastro.
        Conta ausente retorna 404 account_not_provisioned; inativa, 403 account_inactive.
        Após autenticar, o cliente consulta esta rota antes de obter credencial Microsoft:
        somente ausência de conta ou de evidência vigente exige verificação institucional.
        Falhas de comunicação e recusas não devem ser interpretadas como conta ausente.
        O timeout total é de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Conta restaurada; evidência nula exige sincronização Microsoft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
              example:
                user:
                  id: "00000000-0000-0000-0000-000000000010"
                  status: active
                  nickname: Pessoa
                  email: escolhido@example.test
                  currentSemester: 4
                  institutionEntrySemester: "2023.2"
                verification: null
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Identidade autenticada ainda sem conta CApp; requer primeira verificação institucional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_not_provisioned
                  message: Esta identidade ainda não possui uma conta no CApp
                  details: null
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

  /users/me/profile:
    put:
      operationId: completeUserProfile
      tags: [Identidade]
      summary: Concluir ou atualizar o perfil da conta autenticada
      description: |
        Exige ID token Firebase originado de autenticação password, com a credencial
        vinculada ao mesmo UID da Microsoft, e confirmação institucional vigente.
        Não recebe senha, UID, status ou e-mail de login no corpo. O e-mail interno vem do JWT
        validado, podendo ser diferente do institucional. Apelido, período atual e
        semestre de ingresso são obrigatórios. O apelido é aparado.
        name é um complemento opcional declarado pelo usuário, aceito somente
        quando o Graph retornou null para o nome. Não substitui a evidência
        institucional. Curso e e-mail institucional não são aceitos no formulário.
        O e-mail escolhido é confirmado pelo Firebase, independente da sugestão Graph.
        Concluir o perfil muda Incomplete para Active, sem reativar contas inativas.
        Repetir a atualização preserva ID e a data da primeira conclusão.
        Apelido não é tratado como identificador único. Timeout total de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileRequest"
            example:
              nickname: Pessoa
              currentSemester: 4
              institutionEntrySemester: "2023.2"
      responses:
        "200":
          description: Perfil completo e conta ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
              example:
                id: "00000000-0000-0000-0000-000000000010"
                status: active
                nickname: Pessoa
                email: escolhido@example.test
                currentSemester: 4
                institutionEntrySemester: "2023.2"
        "400":
          description: JSON inválido, campos extras ou dados inválidos (invalid_profile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: app_check_required, app_check_invalid, password_required, institutional_verification_required ou account_inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

  /academic-centers/{academicCenterId}/polls:
    parameters:
      - $ref: "#/components/parameters/AcademicCenterId"
    get:
      operationId: listAcademicCenterPolls
      tags: [Consultas e Enquetes]
      summary: Listar consultas estudantis do Centro Acadêmico
      description: Retorna todas as consultas cadastradas para o Centro Acadêmico informado com suas opções e apurações.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Lista de consultas estudantis do Centro Acadêmico.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PollResponse"
              example:
                - id: "00000000-0000-0000-0000-000000000101"
                  academicCenterId: "00000000-0000-0000-0000-000000000001"
                  createdById: "00000000-0000-0000-0000-000000000010"
                  title: "Ampliação do horário dos laboratórios"
                  description: "Manter os laboratórios abertos até as 22h nos dias letivos"
                  targetAudience: "all_students"
                  voteModality: "identified"
                  startsAt: "2026-11-23T12:00:00Z"
                  endsAt: "2026-11-30T12:00:00Z"
                  status: "open"
                  totalVotes: 3
                  options:
                    - id: "00000000-0000-0000-0000-000000000201"
                      title: "Apoio a proposta"
                      order: 1
                      voteCount: 2
                      percentage: 66.67
                    - id: "00000000-0000-0000-0000-000000000202"
                      title: "Não apoio a proposta"
                      order: 2
                      voteCount: 1
                      percentage: 33.33
                  createdAt: "2026-11-23T12:00:00Z"
                  updatedAt: "2026-11-23T12:00:00Z"
                  closedAt: null
                  closedById: null
        "404":
          description: Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: ca_not_found
                  message: Centro Acadêmico não encontrado
                  details: null
    post:
      operationId: createAcademicCenterPoll
      tags: [Consultas e Enquetes]
      summary: Cadastrar consulta estudantil no Centro Acadêmico
      description: Cria uma nova consulta estudantil com opções de voto pela gestão autorizada do Centro Acadêmico.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePollRequest"
            example:
              title: "Ampliação do horário dos laboratórios"
              description: "Manter os laboratórios abertos até as 22h nos dias letivos"
              options:
                - "Apoio a proposta"
                - "Não apoio a proposta"
              startsAt: "2026-11-23T12:00:00Z"
              endsAt: "2026-11-30T12:00:00Z"
              targetAudience: "all_students"
              voteModality: "identified"
      responses:
        "201":
          description: Consulta estudantil registrada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResponse"
              example:
                id: "00000000-0000-0000-0000-000000000101"
                academicCenterId: "00000000-0000-0000-0000-000000000001"
                createdById: "00000000-0000-0000-0000-000000000010"
                title: "Ampliação do horário dos laboratórios"
                description: "Manter os laboratórios abertos até as 22h nos dias letivos"
                targetAudience: "all_students"
                voteModality: "identified"
                startsAt: "2026-11-23T12:00:00Z"
                endsAt: "2026-11-30T12:00:00Z"
                status: "open"
                totalVotes: 0
                options:
                  - id: "00000000-0000-0000-0000-000000000201"
                    title: "Apoio a proposta"
                    order: 1
                    voteCount: 0
                    percentage: 0.0
                  - id: "00000000-0000-0000-0000-000000000202"
                    title: "Não apoio a proposta"
                    order: 2
                    voteCount: 0
                    percentage: 0.0
                createdAt: "2026-11-23T12:00:00Z"
                updatedAt: "2026-11-23T12:00:00Z"
                closedAt: null
                closedById: null
        "403":
          description: Usuário não possui permissão de gestão no Centro Acadêmico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: user_not_permitted_in_ca
                  message: Usuário não possui permissão de gestão no Centro Acadêmico
                  details: null
        "404":
          description: Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: ca_not_found
                  message: Centro Acadêmico não encontrado
                  details: null
        "422":
          description: Erro de validação de negócio (opções insuficientes, datas inválidas ou CA inativo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: invalid_poll_options
                  message: A consulta exige ao menos 2 opções de voto distintas
                  details: null

  /academic-centers/{academicCenterId}/polls/{pollId}:
    parameters:
      - $ref: "#/components/parameters/AcademicCenterId"
      - $ref: "#/components/parameters/PollId"
    get:
      operationId: getAcademicCenterPoll
      tags: [Consultas e Enquetes]
      summary: Obter detalhes e apuração de uma consulta estudantil
      description: Retorna os dados cadastrais da consulta com as opções e os votos/percentuais apurados.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Detalhes da consulta e apuração de resultados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResponse"
              example:
                id: "00000000-0000-0000-0000-000000000101"
                academicCenterId: "00000000-0000-0000-0000-000000000001"
                createdById: "00000000-0000-0000-0000-000000000010"
                title: "Ampliação do horário dos laboratórios"
                description: "Manter os laboratórios abertos até as 22h nos dias letivos"
                targetAudience: "all_students"
                voteModality: "identified"
                startsAt: "2026-11-23T12:00:00Z"
                endsAt: "2026-11-30T12:00:00Z"
                status: "open"
                totalVotes: 3
                options:
                  - id: "00000000-0000-0000-0000-000000000201"
                    title: "Apoio a proposta"
                    order: 1
                    voteCount: 2
                    percentage: 66.67
                  - id: "00000000-0000-0000-0000-000000000202"
                    title: "Não apoio a proposta"
                    order: 2
                    voteCount: 1
                    percentage: 33.33
                createdAt: "2026-11-23T12:00:00Z"
                updatedAt: "2026-11-23T12:00:00Z"
                closedAt: null
                closedById: null
        "404":
          description: Consulta ou Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: poll_not_found
                  message: Consulta estudantil não encontrada
                  details: null

  /academic-centers/{academicCenterId}/polls/{pollId}/votes:
    parameters:
      - $ref: "#/components/parameters/AcademicCenterId"
      - $ref: "#/components/parameters/PollId"
    post:
      operationId: voteInAcademicCenterPoll
      tags: [Consultas e Enquetes]
      summary: Registrar voto em uma consulta estudantil
      description: Registra o voto de um estudante autenticado e elegível em uma opção enquanto a consulta estiver aberta.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotePollRequest"
            example:
              optionId: "00000000-0000-0000-0000-000000000201"
      responses:
        "201":
          description: Voto computado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResponse"
              example:
                id: "00000000-0000-0000-0000-000000000301"
                pollId: "00000000-0000-0000-0000-000000000101"
                optionId: "00000000-0000-0000-0000-000000000201"
                userId: "00000000-0000-0000-0000-000000000010"
                votedAt: "2026-11-23T12:00:00Z"
        "403":
          description: Estudante não elegível para votar nesta consulta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: student_not_eligible
                  message: Estudante não é elegível para participar desta consulta
                  details: null
        "404":
          description: Consulta ou Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: poll_not_found
                  message: Consulta estudantil não encontrada
                  details: null
        "409":
          description: Voto duplicado; estudante já participou desta consulta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: duplicate_vote
                  message: O estudante já registrou seu voto nesta consulta
                  details: null
        "422":
          description: Consulta encerrada, votação fora do prazo ou opção inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: poll_closed
                  message: Esta consulta estudantil encontra-se encerrada
                  details: null

  /academic-centers/{academicCenterId}/polls/{pollId}/close:
    parameters:
      - $ref: "#/components/parameters/AcademicCenterId"
      - $ref: "#/components/parameters/PollId"
    post:
      operationId: closeAcademicCenterPoll
      tags: [Consultas e Enquetes]
      summary: Encerrar consulta estudantil
      description: Encerra antecipadamente a consulta por um integrante autorizado da gestão do Centro Acadêmico.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Consulta encerrada com sucesso e apuração atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollResponse"
              example:
                id: "00000000-0000-0000-0000-000000000101"
                academicCenterId: "00000000-0000-0000-0000-000000000001"
                createdById: "00000000-0000-0000-0000-000000000010"
                title: "Ampliação do horário dos laboratórios"
                description: "Manter os laboratórios abertos até as 22h nos dias letivos"
                targetAudience: "all_students"
                voteModality: "identified"
                startsAt: "2026-11-23T12:00:00Z"
                endsAt: "2026-11-30T12:00:00Z"
                status: "closed"
                totalVotes: 3
                options:
                  - id: "00000000-0000-0000-0000-000000000201"
                    title: "Apoio a proposta"
                    order: 1
                    voteCount: 2
                    percentage: 66.67
                  - id: "00000000-0000-0000-0000-000000000202"
                    title: "Não apoio a proposta"
                    order: 2
                    voteCount: 1
                    percentage: 33.33
                createdAt: "2026-11-23T12:00:00Z"
                updatedAt: "2026-11-23T12:00:00Z"
                closedAt: "2026-11-23T12:00:00Z"
                closedById: "00000000-0000-0000-0000-000000000010"
        "403":
          description: Usuário não possui permissão para encerrar consultas no Centro Acadêmico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: user_not_permitted_in_ca
                  message: Usuário não possui permissão de gestão no Centro Acadêmico
                  details: null
        "404":
          description: Consulta ou Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: poll_not_found
                  message: Consulta estudantil não encontrada
                  details: null
        "422":
          description: Consulta já encerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: poll_closed
                  message: Esta consulta estudantil encontra-se encerrada
                  details: null

components:
  parameters:
    ElectionId:
      in: path
      name: id
      required: true
      description: UUID da eleição publicado no manifesto.
      schema:
        type: string
        format: uuid
    AcademicCenterId:
      in: path
      name: academicCenterId
      required: true
      description: Identificador único do Centro Acadêmico (UUID).
      schema:
        type: string
        format: uuid
    PollId:
      in: path
      name: pollId
      required: true
      description: Identificador único da consulta estudantil (UUID).
      schema:
        type: string
        format: uuid
  responses:
    BoardNotFound:
      description: A eleição ainda não possui quadro publicado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidAccountCredential:
      description: Credencial Firebase ausente, inválida, expirada ou identidade divergente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountAccessDenied:
      description: app_check_required, app_check_invalid, institutional_verification_required ou account_inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountInternalError:
      description: Falha interna; nenhum diagnóstico ou credencial é exposto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountServiceUnavailable:
      description: app_check_unavailable, serviço indisponível ou timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    FirebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: |
        JWT Firebase App Check emitido para um App ID permitido do mesmo projeto.
        Comprova o aplicativo, independentemente do usuário. Não enviar o token de
        depuração do Console neste cabeçalho; o SDK o troca por um JWT App Check.
        Obrigatório nas rotas autenticadas. Saúde, prontidão e leituras do quadro são públicos.
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token do projeto configurado no backend, com identidade
        microsoft.com vinculada. Enviar um único Authorization: Bearer <ID_TOKEN>.
        O access token Microsoft é enviado separadamente no corpo da verificação.
  schemas:
    ElectionEvidence:
      type: object
      description: Envelope assinado do quadro eleitoral, com payload do protocolo v1.
      additionalProperties: false
      required: [payload, signature]
      properties:
        signature:
          $ref: "./elections/schemas.json#/$defs/Base64Url"
        payload:
          oneOf:
            - $ref: "./elections/schemas.json#/$defs/CalendarOrigin"
            - $ref: "./elections/schemas.json#/$defs/Manifest"
            - $ref: "./elections/schemas.json#/$defs/BoardEntry"
            - $ref: "./elections/schemas.json#/$defs/Receipt"
            - $ref: "./elections/schemas.json#/$defs/Closure"
            - $ref: "./elections/schemas.json#/$defs/Aggregate"
    ElectionBoardSnapshot:
      type: object
      additionalProperties: false
      required: [manifest, calendarOrigin, entries, checkpoint, closure, aggregate]
      properties:
        manifest:
          $ref: "#/components/schemas/ElectionEvidence"
        calendarOrigin:
          $ref: "#/components/schemas/ElectionEvidence"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ElectionEvidence"
        checkpoint:
          description: Último recibo confirmado. Nulo antes do primeiro voto.
          anyOf:
            - $ref: "#/components/schemas/ElectionEvidence"
            - type: "null"
        closure:
          description: Termo assinado ao encerrar a votação.
          anyOf:
            - $ref: "#/components/schemas/ElectionEvidence"
            - type: "null"
        aggregate:
          description: Produto das cifras vinculado ao termo de encerramento.
          anyOf:
            - $ref: "#/components/schemas/ElectionEvidence"
            - type: "null"
    InternalUserResponse:
      type: object
      required: [id, status, nickname, email, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Nome declarado para uma ausência do Graph; não é evidência institucional.
        id:
          type: string
          format: uuid
          description: ID interno estável, compartilhado entre os provedores vinculados no Firebase.
        status:
          type: string
          enum: [incomplete, active, inactive]
        nickname:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
          description: E-mail escolhido para a credencial interna; não é necessariamente institucional.
        currentSemester:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: Período atual do curso, independente do tempo desde o ingresso.
        institutionEntrySemester:
          type: [string, "null"]
          pattern: '^[0-9]{4}\.[12]$'
          description: Semestre de ingresso na instituição, como 2023.2.
      allOf:
        - if:
            properties:
              status:
                const: active
          then:
            properties:
              id: {}
              status: {}
              nickname:
                type: string
                pattern: '\S'
              email:
                type: string
                minLength: 1
              currentSemester:
                type: integer
              institutionEntrySemester:
                type: string
    InstitutionalAuthResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          $ref: "#/components/schemas/InstitutionalVerificationResponse"
        suggestedEmail:
          type: string
          format: email
          minLength: 1
          description: Sugestão transitória do Graph para o cadastro. Omitida se indisponível ou a conta não estiver Incomplete. Não integra a verificação nem os caches.
      allOf:
        - if:
            properties:
              user:
                properties:
                  status:
                    enum: [active, inactive]
          then:
            not:
              properties:
                suggestedEmail: {}
              required: [suggestedEmail]

    AccountSessionResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          oneOf:
            - $ref: "#/components/schemas/InstitutionalVerificationResponse"
            - type: "null"
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Complemento opcional, aceito somente se o nome do Graph for null.
        nickname:
          type: string
          minLength: 1
          pattern: '\S'
          description: Apelido obrigatório, aparado antes de persistir.
        currentSemester:
          type: integer
          minimum: 1
          maximum: 2147483647
        institutionEntrySemester:
          type: string
          pattern: '^[0-9]{4}\.[12]$'
    InstitutionalAuthRequest:
      type: object
      required: [microsoftAccessToken]
      properties:
        microsoftAccessToken:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Access token delegado para consultar organização, perfil e participação
            em grupos no Microsoft Graph. Não é um Firebase ID token. Strings vazias
            são rejeitadas; o backend não aplica trim antes de consultar o provedor.
    InstitutionalVerificationResponse:
      type: object
      required: [profile, institution, expiresAt]
      properties:
        profile:
          $ref: "#/components/schemas/InstitutionalIdentityResponse"
        institution:
          $ref: "#/components/schemas/InstitutionSummaryResponse"
        expiresAt:
          type: string
          format: date-time
          description: |
            Instante UTC (RFC 3339) de expiração da evidência institucional: 120 dias
            após o início das consultas institucionais. Não é a expiração do token
            Firebase e não substitui a validação no servidor. A resposta não inclui
            um campo ttl separado.
    InstitutionSummaryResponse:
      type: object
      description: |
        Resumo público da instituição identificada na verificação institucional.
        Os dados vêm do cadastro do CApp; tenant e grupo Microsoft não são expostos.
        Sua presença não comprova vínculo estudantil nem concede permissões.
      required: [id, name, acronym]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da instituição no CApp; não é o tenant Microsoft.
        name:
          type: string
          description: Nome da instituição registrado no cadastro do CApp.
        acronym:
          type: [string, "null"]
          description: Sigla cadastrada, como UnB; o campo é retornado como null quando ausente.
    InstitutionalIdentityResponse:
      type: object
      required: [microsoftObjectId, name, affiliation]
      properties:
        microsoftObjectId:
          type: string
          format: uuid
          description: Identificador de objeto Microsoft validado como UUID; não é o UID Firebase nem um ID interno do CApp.
          examples: ["00000000-0000-0000-0000-000000000001"]
        name:
          type: [string, "null"]
          description: displayName fornecido pela instituição, ou null se ausente.
        affiliation:
          $ref: "#/components/schemas/InstitutionalAffiliation"
    InstitutionalAffiliation:
      description: Vínculo estudantil exige participação no grupo configurado e curso não vazio obtido no Graph. A ausência de qualquer um permite apenas acesso limitado.
      oneOf:
        - $ref: "#/components/schemas/StudentAffiliation"
        - $ref: "#/components/schemas/NonStudentAffiliation"
      discriminator:
        propertyName: type
        mapping:
          student: "#/components/schemas/StudentAffiliation"
          nonStudent: "#/components/schemas/NonStudentAffiliation"
    StudentAffiliation:
      type: object
      additionalProperties: false
      required: [type, courseName]
      properties:
        type:
          type: string
          const: student
        courseName:
          type: string
          minLength: 1
          pattern: '\S'
          description: Curso não vazio retornado pelo Graph para integrante do grupo estudantil; ainda sem associação ao catálogo interno de cursos.
    NonStudentAffiliation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: nonStudent
          description: Grupo estudantil não confirmado ou curso ausente, nulo ou em branco no Graph. Permite entrada limitada, sem direitos de estudante em nenhum CA. courseName não é retornado.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorDetails"
    ApiErrorDetails:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Identificador estável para tratamento programático; os códigos aplicáveis estão descritos em cada resposta HTTP.
        message:
          type: string
          description: Mensagem pública legível, sem diagnósticos internos ou credenciais.
        details:
          description: Contexto público adicional ou null. Os erros atuais da rota de verificação retornam null.
    CreatePollRequest:
      type: object
      required: [title, options]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Título da consulta estudantil.
        description:
          type: [string, "null"]
          maxLength: 4000
          description: Descrição ou texto da proposta.
        options:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Opções de voto disponíveis na consulta.
        startsAt:
          type: [string, "null"]
          format: date-time
          description: Data e hora UTC de início da votação.
        endsAt:
          type: [string, "null"]
          format: date-time
          description: Data e hora UTC de término da votação.
        targetAudience:
          type: [string, "null"]
          description: Público-alvo da consulta (padrão all_students).
        voteModality:
          type: [string, "null"]
          enum: [identified, secret, null]
          description: Modalidade de votação (identified ou secret).
    VotePollRequest:
      type: object
      required: [optionId]
      properties:
        optionId:
          type: string
          format: uuid
          description: Identificador único da opção de voto escolhida.
    PollOptionResponse:
      type: object
      required: [id, title, order, voteCount, percentage]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da opção.
        title:
          type: string
          description: Texto da opção de voto.
        order:
          type: integer
          description: Ordem de exibição da opção.
        voteCount:
          type: integer
          format: int64
          description: Total de votos recebidos pela opção.
        percentage:
          type: number
          format: double
          description: Percentual de votos recebidos (0.0 a 100.0).
    PollResponse:
      type: object
      required:
        - id
        - academicCenterId
        - createdById
        - title
        - targetAudience
        - voteModality
        - startsAt
        - status
        - totalVotes
        - options
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da consulta.
        academicCenterId:
          type: string
          format: uuid
          description: Identificador do Centro Acadêmico.
        createdById:
          type: string
          format: uuid
          description: Identificador do usuário que criou a consulta.
        title:
          type: string
          description: Título da consulta.
        description:
          type: [string, "null"]
          description: Descrição da consulta ou null.
        targetAudience:
          type: string
          description: Público-alvo configurado.
        voteModality:
          type: string
          description: Modalidade da votação (identified ou secret).
        startsAt:
          type: string
          format: date-time
          description: Início do período de votação.
        endsAt:
          type: [string, "null"]
          format: date-time
          description: Término do período de votação ou null.
        status:
          type: string
          enum: [open, closed]
          description: Situação da consulta (open ou closed).
        totalVotes:
          type: integer
          format: int64
          description: Total de votos apurados.
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResponse"
          description: Opções de voto com apuração.
        createdAt:
          type: string
          format: date-time
          description: Instante de criação da consulta.
        updatedAt:
          type: string
          format: date-time
          description: Instante da última atualização.
        closedAt:
          type: [string, "null"]
          format: date-time
          description: Instante de encerramento da consulta ou null.
        closedById:
          type: [string, "null"]
          format: uuid
          description: Identificador do gestor que encerrou a consulta ou null.
    VoteResponse:
      type: object
      required: [id, pollId, optionId, userId, votedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do voto.
        pollId:
          type: string
          format: uuid
          description: Identificador da consulta votada.
        optionId:
          type: string
          format: uuid
          description: Identificador da opção escolhida.
        userId:
          type: string
          format: uuid
          description: Identificador do estudante votante.
        votedAt:
          type: string
          format: date-time
          description: Instante em que o voto foi registrado.
