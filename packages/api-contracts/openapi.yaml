openapi: 3.1.0

info:
  title: CApp API
  version: 3.0.0
  description: |
    Contrato das rotas atualmente implementadas no backend CApp.
    Os caminhos são servidos sem prefixo /v1.
    Desde 2.0.0, rotas de negócio exigem X-Firebase-AppCheck além do Firebase
    ID token. O servidor verifica assinatura, emissor, audiência, validade e
    App ID permitido. app_check_required e app_check_invalid retornam 403;
    app_check_unavailable retorna 503. /health e /ready dispensam ambos os tokens.
    Desde 3.0.0, POST /auth/institutional/verify retorna user e verification
    no mesmo envelope.

    A verificação institucional valida um Firebase ID token e um Microsoft access
    token da mesma pessoa, consulta a instituição pelo tenant Microsoft, verifica
    a participação no grupo estudantil e persiste a evidência por 120 dias.
    Estudantes e não estudantes podem concluir a verificação. Ela provisiona
    uma conta interna incompleta por UID Firebase, sem criar credenciais ou conceder permissões
    específicas de curso. A expiração informada é da evidência institucional,
    independente da expiração do ID token Firebase.

tags:
  - name: Infraestrutura
    description: Saúde do processo e comunicação com PostgreSQL.
  - name: Identidade
    description: Verificação das credenciais e do vínculo institucional.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Infraestrutura]
      summary: Verificar se o servidor responde
      description: Não consulta PostgreSQL, Firebase ou Microsoft Graph.
      security: []
      responses:
        "200":
          description: O processo HTTP está respondendo.
          content:
            text/plain:
              schema:
                type: string
                const: O servidor está saudável.
              example: O servidor está saudável.

  /ready:
    get:
      operationId: getReadiness
      tags: [Infraestrutura]
      summary: Verificar a comunicação com PostgreSQL
      description: |
        Executa SELECT 1 AS ok, com limite total de dois segundos para aquisição
        da conexão e execução. Não verifica tabelas, versão do esquema ou
        disponibilidade dos provedores de autenticação. As respostas não têm corpo.
      security: []
      responses:
        "200":
          description: Consulta ao PostgreSQL concluída.
        "503":
          description: Erro de comunicação com PostgreSQL ou tempo limite excedido.

  /auth/institutional/verify:
    post:
      operationId: verifyInstitutionalIdentity
      tags: [Identidade]
      summary: Criar ou renovar a verificação institucional
      description: |
        Exige um Firebase ID token no cabeçalho Authorization e um Microsoft
        access token delegado no corpo. A identidade Microsoft vinculada ao ID
        token deve corresponder ao perfil obtido no Graph.

        O backend consulta a organização Microsoft, busca a instituição cadastrada
        pelo tenant e usa o grupo dessa instituição em me/checkMemberGroups.
        A ausência de participação no grupo resulta em affiliation.type=nonStudent,
        sem rejeitar a autenticação. jobTitle é interpretado como curso somente
        quando a participação estudantil foi confirmada. Nome, e-mail e curso
        podem estar ausentes e são serializados como null.

        A resposta inclui user com a conta provisionada e verification com a evidência,
        dispensando GET /auth/session após esta operação. verification inclui institution com o identificador interno, o nome e a
        sigla do cadastro institucional do CApp. A sigla pode ser null. Esse resumo
        não expõe tenant ou grupo Microsoft e não concede permissões nem comprova,
        por si só, vínculo estudantil; o vínculo está em profile.affiliation.

        Não exige uma verificação institucional anterior. O serviço tem timeout
        total de 15 segundos; o cancelamento não garante desfazer uma gravação
        já concluída. Após confrontar as identidades, provisiona uma conta incompleta
        de forma idempotente, preservando o ID, o perfil e o status de contas existentes.
        Não reativa contas inativas. Perfil e credencial interna são concluídos separadamente.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        description: Credencial Microsoft da mesma identidade vinculada ao Firebase.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionalAuthRequest"
            examples:
              institutionalAuthRequest:
                summary: Requisição de verificação institucional
                externalValue: ./examples/institutional-auth-request.json
      responses:
        "200":
          description: Identidade verificada e evidência institucional persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalAuthResponse"
              examples:
                student:
                  summary: Estudante com curso informado pelo diretório
                  externalValue: ./examples/institutional-verification-student.json
                studentWithoutOptionalData:
                  summary: Estudante sem nome, e-mail ou curso informado e instituição sem sigla
                  externalValue: ./examples/institutional-verification-student-null-fields.json
                nonStudent:
                  summary: Pessoa sem participação no grupo estudantil
                  externalValue: ./examples/institutional-verification-non-student.json
        "400":
          description: |
            bad_request — JSON ausente, malformado, de tipo incompatível ou
            rejeitado pelo extractor (inclusive Content-Type inadequado ou limite
            de corpo excedido); microsoftAccessToken ausente, null ou vazio.
            Todas essas rejeições são normalizadas para HTTP 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Requisição inválida
                  details: null
        "401":
          description: |
            Credenciais inválidas. Códigos possíveis:
            - unauthorized: Authorization ausente, repetido ou Bearer malformado;
            - invalid_token: credencial rejeitada pelo verificador ou pelo Graph;
            - expired_token: ID token Firebase expirado;
            - invalid_microsoft_id: identificador Microsoft vinculado ausente ou inválido;
            - identity_mismatch: ID token e perfil Microsoft representam pessoas diferentes.
          headers:
            WWW-Authenticate:
              description: Desafio Bearer incluído em todas as respostas 401.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: Autenticação necessária
                      details: null
                invalidToken:
                  value:
                    error:
                      code: invalid_token
                      message: Token de autenticação inválido
                      details: null
                expiredToken:
                  value:
                    error:
                      code: expired_token
                      message: Token de autenticação expirado
                      details: null
                invalidMicrosoftId:
                  value:
                    error:
                      code: invalid_microsoft_id
                      message: Identificador Microsoft ausente ou inválido
                      details: null
                identityMismatch:
                  value:
                    error:
                      code: identity_mismatch
                      message: As identidades autenticadas não correspondem
                      details: null
        "403":
          description: |
            app_check_required ou app_check_invalid — comprovação do aplicativo ausente ou recusada.
            unknown_institution — o tenant Microsoft não corresponde a uma
            instituição cadastrada.
            account_inactive — a conta interna foi desativada e não é reativada pelo login.
            institutional_verification_required — uma verificação concorrente com
            início igual ou posterior já foi persistida para o mesmo UID e esta
            tentativa não a substituiu; repita a verificação institucional.
            Não pertencer ao grupo estudantil não gera esses erros; a resposta
            é 200 com o vínculo nonStudent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unknownInstitution:
                  externalValue: ./examples/api-error-unknown-institution.json
                concurrentVerification:
                  value:
                    error:
                      code: institutional_verification_required
                      message: É necessário verificar novamente seu vínculo institucional.
                      details: null
        "500":
          description: internal_server_error — falha interna, inclusive de persistência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_server_error
                  message: Erro interno do servidor
                  details: null
        "503":
          description: |
            app_check_unavailable — não foi possível obter chaves válidas do App Check.
            authentication_provider_unavailable — falha de comunicação, resposta
            inesperada ou indisponibilidade de Firebase/JWKS ou Microsoft Graph.
            service_unavailable — timeout total de 15 segundos do serviço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                providerUnavailable:
                  value:
                    error:
                      code: authentication_provider_unavailable
                      message: Serviço de autenticação temporariamente indisponível
                      details: null
                timeout:
                  value:
                    error:
                      code: service_unavailable
                      message: Serviço temporariamente indisponível
                      details: null


  /auth/session:
    get:
      operationId: restoreAccountSession
      tags: [Identidade]
      summary: Restaurar a conta interna e a confirmação institucional vigente
      description: |
        Valida o ID token Firebase e consulta a conta provisionada. Não consulta o
        Graph nem exige access token Microsoft. verification é null quando a evidência
        expirou ou sua configuração institucional mudou; o perfil interno é preservado.
        Uma conta incompleta também pode restaurar sua sessão para concluir o cadastro.
        Conta ausente retorna 404 account_not_provisioned; inativa, 403 account_inactive.
        Após autenticar, o cliente consulta esta rota antes de obter credencial Microsoft:
        somente ausência de conta ou de evidência vigente exige verificação institucional.
        Falhas de comunicação e recusas não devem ser interpretadas como conta ausente.
        O timeout total é de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Conta restaurada; evidência nula exige sincronização Microsoft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
              example:
                user:
                  id: "00000000-0000-0000-0000-000000000010"
                  status: active
                  nickname: Pessoa
                  email: escolhido@example.test
                  currentSemester: 4
                  institutionEntrySemester: "2023.2"
                verification: null
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Identidade autenticada ainda sem conta CApp; requer primeira verificação institucional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_not_provisioned
                  message: Esta identidade ainda não possui uma conta no CApp
                  details: null
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

  /users/me/profile:
    put:
      operationId: completeUserProfile
      tags: [Identidade]
      summary: Concluir ou atualizar o perfil da conta autenticada
      description: |
        Exige ID token Firebase originado de autenticação password, com a credencial
        vinculada ao mesmo UID da Microsoft, e confirmação institucional vigente.
        Não recebe senha, UID, status ou e-mail de login no corpo. O e-mail interno vem do JWT
        validado, podendo ser diferente do institucional. Apelido, período atual e
        semestre de ingresso são obrigatórios. O apelido é aparado.
        name, institutionalEmail e courseName são complementos opcionais declarados
        pelo usuário, aceitos somente quando o Graph retornou null para o atributo.
        courseName só é aceito para estudantes confirmados. Não substituem a evidência
        institucional nem comprovam titularidade do e-mail ou vínculo com o curso.
        Concluir o perfil muda Incomplete para Active, sem reativar contas inativas.
        Repetir a atualização preserva ID e a data da primeira conclusão.
        Apelido não é tratado como identificador único. Timeout total de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileRequest"
            example:
              nickname: Pessoa
              currentSemester: 4
              institutionEntrySemester: "2023.2"
      responses:
        "200":
          description: Perfil completo e conta ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
              example:
                id: "00000000-0000-0000-0000-000000000010"
                status: active
                nickname: Pessoa
                email: escolhido@example.test
                currentSemester: 4
                institutionEntrySemester: "2023.2"
        "400":
          description: JSON inválido, campos extras ou dados inválidos (invalid_profile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: app_check_required, app_check_invalid, password_required, institutional_verification_required ou account_inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

components:
  responses:
    InvalidAccountCredential:
      description: Credencial Firebase ausente, inválida, expirada ou identidade divergente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountAccessDenied:
      description: app_check_required, app_check_invalid, institutional_verification_required ou account_inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountInternalError:
      description: Falha interna; nenhum diagnóstico ou credencial é exposto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountServiceUnavailable:
      description: app_check_unavailable, serviço indisponível ou timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    FirebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: |
        JWT Firebase App Check emitido para um App ID permitido do mesmo projeto.
        Comprova o aplicativo, independentemente do usuário. Não enviar o token de
        depuração do Console neste cabeçalho; o SDK o troca por um JWT App Check.
        Obrigatório em todas as rotas de negócio; /health e /ready são públicos.
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token do projeto configurado no backend, com identidade
        microsoft.com vinculada. Enviar um único Authorization: Bearer <ID_TOKEN>.
        O access token Microsoft é enviado separadamente no corpo da verificação.
  schemas:
    InternalUserResponse:
      type: object
      required: [id, status, nickname, email, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Nome declarado para uma ausência do Graph; não é evidência institucional.
        institutionalEmail:
          type: [string, "null"]
          format: email
          description: Contato declarado quando ausente no Graph, distinto do e-mail de login e sem comprovação automática.
        courseName:
          type: [string, "null"]
          description: Curso declarado por estudante quando ausente no Graph; não concede permissões.
        id:
          type: string
          format: uuid
          description: ID interno estável, compartilhado entre os provedores vinculados no Firebase.
        status:
          type: string
          enum: [incomplete, active, inactive]
        nickname:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
          description: E-mail escolhido para a credencial interna; não é necessariamente institucional.
        currentSemester:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: Período atual do curso, independente do tempo desde o ingresso.
        institutionEntrySemester:
          type: [string, "null"]
          pattern: '^[0-9]{4}\.[12]$'
          description: Semestre de ingresso na instituição, como 2023.2.
      allOf:
        - if:
            properties:
              status:
                const: active
          then:
            properties:
              id: {}
              status: {}
              nickname:
                type: string
                pattern: '\S'
              email:
                type: string
                minLength: 1
              currentSemester:
                type: integer
              institutionEntrySemester:
                type: string
    InstitutionalAuthResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          $ref: "#/components/schemas/InstitutionalVerificationResponse"

    AccountSessionResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          oneOf:
            - $ref: "#/components/schemas/InstitutionalVerificationResponse"
            - type: "null"
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Complemento opcional, aceito somente se o nome do Graph for null.
        institutionalEmail:
          type: [string, "null"]
          format: email
          description: Contato opcional, aceito somente se o e-mail do Graph for null; não altera o login.
        courseName:
          type: [string, "null"]
          description: Complemento opcional, aceito somente para estudante confirmado cujo curso no Graph for null.
        nickname:
          type: string
          minLength: 1
          pattern: '\S'
          description: Apelido obrigatório, aparado antes de persistir.
        currentSemester:
          type: integer
          minimum: 1
          maximum: 2147483647
        institutionEntrySemester:
          type: string
          pattern: '^[0-9]{4}\.[12]$'
    InstitutionalAuthRequest:
      type: object
      required: [microsoftAccessToken]
      properties:
        microsoftAccessToken:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Access token delegado para consultar organização, perfil e participação
            em grupos no Microsoft Graph. Não é um Firebase ID token. Strings vazias
            são rejeitadas; o backend não aplica trim antes de consultar o provedor.
    InstitutionalVerificationResponse:
      type: object
      required: [profile, institution, expiresAt]
      properties:
        profile:
          $ref: "#/components/schemas/InstitutionalIdentityResponse"
        institution:
          $ref: "#/components/schemas/InstitutionSummaryResponse"
        expiresAt:
          type: string
          format: date-time
          description: |
            Instante UTC (RFC 3339) de expiração da evidência institucional: 120 dias
            após o início das consultas institucionais. Não é a expiração do token
            Firebase e não substitui a validação no servidor. A resposta não inclui
            um campo ttl separado.
    InstitutionSummaryResponse:
      type: object
      description: |
        Resumo público da instituição identificada na verificação institucional.
        Os dados vêm do cadastro do CApp; tenant e grupo Microsoft não são expostos.
        Sua presença não comprova vínculo estudantil nem concede permissões.
      required: [id, name, acronym]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da instituição no CApp; não é o tenant Microsoft.
        name:
          type: string
          description: Nome da instituição registrado no cadastro do CApp.
        acronym:
          type: [string, "null"]
          description: Sigla cadastrada, como UnB; o campo é retornado como null quando ausente.
    InstitutionalIdentityResponse:
      type: object
      required: [microsoftObjectId, name, email, affiliation]
      properties:
        microsoftObjectId:
          type: string
          format: uuid
          description: Identificador de objeto Microsoft validado como UUID; não é o UID Firebase nem um ID interno do CApp.
          examples: ["00000000-0000-0000-0000-000000000001"]
        name:
          type: [string, "null"]
          description: displayName fornecido pela instituição, ou null se ausente.
        email:
          type: [string, "null"]
          description: mail fornecido pelo diretório Microsoft, ou null se ausente; não há fallback para userPrincipalName.
        affiliation:
          $ref: "#/components/schemas/InstitutionalAffiliation"
    InstitutionalAffiliation:
      description: Vínculo determinado pela participação no grupo estudantil configurado para a instituição.
      oneOf:
        - $ref: "#/components/schemas/StudentAffiliation"
        - $ref: "#/components/schemas/NonStudentAffiliation"
      discriminator:
        propertyName: type
        mapping:
          student: "#/components/schemas/StudentAffiliation"
          nonStudent: "#/components/schemas/NonStudentAffiliation"
    StudentAffiliation:
      type: object
      additionalProperties: false
      required: [type, courseName]
      properties:
        type:
          type: string
          const: student
        courseName:
          type: [string, "null"]
          description: jobTitle do estudante, ou null; ainda não representa associação ao catálogo interno de cursos.
    NonStudentAffiliation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: nonStudent
          description: Participação no grupo estudantil não confirmada; courseName não é retornado e jobTitle não é interpretado como curso.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorDetails"
    ApiErrorDetails:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Identificador estável para tratamento programático; os códigos aplicáveis estão descritos em cada resposta HTTP.
        message:
          type: string
          description: Mensagem pública legível, sem diagnósticos internos ou credenciais.
        details:
          description: Contexto público adicional ou null. Os erros atuais da rota de verificação retornam null.
