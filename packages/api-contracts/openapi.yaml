openapi: 3.1.0

info:
  title: CApp API
  version: 5.1.0
  description: |
    Contrato das rotas atualmente implementadas no backend CApp.
    Os caminhos são servidos sem prefixo /v1.
    Desde 2.0.0, rotas de negócio exigem X-Firebase-AppCheck além do Firebase
    ID token. O servidor verifica assinatura, emissor, audiência, validade e
    App ID permitido. app_check_required e app_check_invalid retornam 403;
    app_check_unavailable retorna 503. /health e /ready dispensam ambos os tokens.
    Desde 3.0.0, POST /auth/institutional/verify retorna user e verification
    no mesmo envelope.
    Desde 4.0.0, o vínculo student exige curso institucional não vazio e o
    perfil interno não aceita courseName declarado pelo usuário. O e-mail do Graph
    é retornado apenas como suggestedEmail durante o cadastro, fora da evidência
    institucional, e não é persistido. Contas ativas preservam o e-mail escolhido.
    A partir de 4.1.0, as leituras do quadro eleitoral e de seu checkpoint são públicas.
    A versão 4.2.0 acrescenta o cadastro privado da chave quando a eleição o exige.
    A versão 4.3.0 recebe cédulas cifradas e assinadas no dispositivo.

    A verificação institucional valida um Firebase ID token e um Microsoft access
    token da mesma pessoa, consulta a instituição pelo tenant Microsoft, verifica
    a participação no grupo estudantil e persiste a evidência por 120 dias.
    Estudantes e não estudantes podem concluir a verificação. Ela provisiona
    uma conta interna incompleta por UID Firebase, sem criar credenciais ou conceder permissões
    específicas de curso. A expiração informada é da evidência institucional,
    independente da expiração do ID token Firebase.

tags:
  - name: Infraestrutura
    description: Saúde do processo e comunicação com PostgreSQL.
  - name: Identidade
    description: Verificação das credenciais e do vínculo institucional.
  - name: Eleições
    description: Distribuição de evidências para verificação pelos eleitores e autoridades.
  - name: Centros Acadêmicos
    description: Gestão, mandatos e governança dos Centros Acadêmicos.

  - name: Demandas
    description: Criação e acompanhamento de demandas nos fóruns institucional e de espaço físico.

  - name: FAQ
    description: Perguntas frequentes e base de conhecimento dos Centros Acadêmicos.

  - name: Consultas e Enquetes
    description: Consultas e enquetes estudantis organizadas pelo Centro Acadêmico.

paths:
  /elections/{id}/ballots:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    post:
      operationId: submitSecretBallot
      tags: [Eleições]
      summary: Registrar voto secreto e obter o recibo assinado
      description: |
        Enviar as cifras na ordem do manifesto, a chave pública e a assinatura.
        A assinatura usa o payload público Ballot v1, sem kind nem version,
        com electionId da rota e accountId da conta autenticada.
        O corpo transporta somente manifestHash, publicKey e ciphertexts no payload.
        O backend reconstitui os campos restantes para verificar a assinatura.
        A entrada é CAPP-ELECTIONS/BALLOT/1, um byte NUL e o payload público em JCS.
        O eleitor precisa ter vínculo vigente com um curso representado pelo CA. A chave é cadastrada
        antes da abertura quando exigido ou vinculada no primeiro voto aceito.
        Se a resposta se perder, o mesmo hash do conteúdo assinado recupera as
        evidências originais, inclusive após o encerramento.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./elections/schemas.json#/$defs/SignedBallotSubmission"
            examples:
              signedBallot:
                externalValue: ./examples/election-ballot-submission.json
      responses:
        "201":
          description: Primeiro aceite. Registro e recibo confirmados no mesmo commit (recovered é false).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RecordedBallot"
                  - type: object
                    properties:
                      recovered:
                        const: false
        "200":
          description: Reenvio de cédula já confirmada. O registro e o recibo são os originais (recovered é true).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RecordedBallot"
                  - type: object
                    properties:
                      recovered:
                        const: true
        "400":
          description: UUID inválido ou cédula recusada por formato, assinatura ou contexto.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta, o App Check ou a elegibilidade eleitoral impedem a submissão.
        "404":
          description: Eleição desconhecida ou conta ainda não provisionada.
        "409":
          description: Prazo, cadastro prévio ausente, chave divergente, participação anterior ou limite de participantes.
        "413":
          description: O envelope excede 262144 bytes.
        "415":
          description: O servidor exige application/json.
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação, emissão de recibo ou armazenamento indisponível.

  /elections/{id}/authority/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: readOwnElectionAuthority
      tags: [Eleições]
      summary: Consultar a designação de autoridade da própria conta
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não foi designada para a eleição.
    put:
      operationId: registerOwnElectionAuthority
      tags: [Eleições]
      summary: Entregar a chave pública e a prova da autoridade
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedAuthorityRegistration"
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "400":
          description: Assinatura, prova ou envelope inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não corresponde à designação.
        "409":
          description: Preparação encerrada ou chave diferente já registrada.
  /elections/{id}/manifest:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: publishElectionManifest
      tags: [Eleições]
      summary: Publicar o manifesto confidencial da comissão designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Preparação encerrada ou credenciais de autoridades pendentes.
  /elections/{id}/period:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: updateElectionPeriod
      tags: [Eleições]
      summary: Adiar a abertura ou prorrogar o fim da votação
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionPeriodChange"
      responses:
        "200":
          description: Período vigente confirmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionPeriod"
        "400":
          description: Período ou motivo inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Eleição cancelada ou já encerrada.
  /elections/{id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: cancelElection
      tags: [Eleições]
      summary: Cancelar a eleição pela comissão designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionCancellationRequest"
      responses:
        "200":
          description: Cancelamento confirmado. Repetições devolvem o cancelamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionCancellation"
        "400":
          description: Motivo inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Eleição já encerrada.
  /elections/{id}/tally:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: readElectionTally
      tags: [Eleições]
      summary: Consultar contribuições e resultado da apuração
      security: []
      responses:
        "200":
          description: Evidências públicas da eleição encerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionTally"
        "404":
          description: Quadro eleitoral inexistente.
        "409":
          description: A votação ainda não foi encerrada.
  /elections/{id}/tally/shares/{authority}:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
      - name: authority
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: submitElectionDecryptionShare
      tags: [Eleições]
      summary: Entregar a contribuição assinada de uma autoridade designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedShare"
      responses:
        "200":
          description: Estado confirmado da apuração após a entrega.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionTally"
        "400":
          description: Prova, assinatura ou vínculo com o encerramento inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: Conta sem atribuição ou origem do aplicativo recusada.
        "409":
          description: Quadro aberto ou contribuição definitiva já aceita.

  /elections/{id}/board:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoard
      tags: [Eleições]
      summary: Exportar o quadro eleitoral público
      description: Retorna uma única fotografia confirmada, com os registros em ordem de aceite.
      security: []
      responses:
        "200":
          description: Evidências públicas do protocolo eleitoral v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionBoardSnapshot"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/board/checkpoint:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoardCheckpoint
      tags: [Eleições]
      summary: Obter a âncora atual do quadro
      description: Guardar fora do servidor para comparar com uma exportação posterior da mesma eleição.
      security: []
      responses:
        "200":
          description: Último recibo assinado, ou o manifesto assinado quando o quadro está vazio.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "./elections/schemas.json#/$defs/SignedManifest"
                  - $ref: "./elections/schemas.json#/$defs/SignedReceipt"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/registration/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getOwnElectionRegistration
      tags: [Eleições]
      summary: Consultar o cadastro e a participação da própria conta
      description: Informa se a eleição exige cadastro prévio e permite consultar a situação após o encerramento.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionRegistration"
        "400":
          description: Identificador da eleição inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          $ref: "#/components/responses/RegistrationNotFound"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação ou armazenamento indisponível.
    put:
      operationId: registerOwnElectionKey
      tags: [Eleições]
      summary: Cadastrar a chave pública do eleitor antes da abertura
      description: |
        Assinar o payload com RSA-PSS/SHA-256 (MGF1-SHA-256, salt de 32 bytes)
        sobre o prefixo CAPP-ELECTIONS/REGISTRATION/1, um byte NUL e o JSON canônico RFC 8785.
        O corpo transporta a chave pública e a assinatura. O backend reconstrói
        o payload assinado com a versão e o tipo fixos, a eleição da rota e o UUID
        interno da conta autenticada. Repetir o cadastro confirmado
        com a mesma chave recupera a inscrição. O servidor mantém o vínculo original.
        A operação se aplica às eleições que exigem cadastro prévio.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionRegistrationProof"
            examples:
              signedRegistration:
                externalValue: ./examples/election-voter-registration.json
      responses:
        "200":
          $ref: "#/components/responses/ElectionRegistration"
        "400":
          description: Identificador inválido ou prova de posse inválida (invalid_registration_proof).
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: App Check, conta ou elegibilidade institucional recusados.
        "404":
          $ref: "#/components/responses/RegistrationNotFound"
        "409":
          description: Cadastro dispensado (registration_not_required), encerrado (registration_closed) ou chave diferente da original (registration_key_conflict).
        "413":
          description: O corpo excede 262144 bytes.
        "415":
          description: O servidor exige application/json.
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação ou armazenamento indisponível.

  /elections/{id}/receipts/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getOwnElectionReceipt
      tags: [Eleições]
      summary: Recuperar o recibo original da conta autenticada
      description: Aceita a consulta depois do encerramento e da expiração da elegibilidade eleitoral.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Recibo assinado e persistido quando a cédula foi aceita.
          content:
            application/json:
              schema:
                $ref: "./elections/schemas.json#/$defs/SignedReceipt"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Conta ainda não provisionada ou sem recibo nessa eleição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Falha interna ao resolver a conta ou o recibo.
        "503":
          description: Não foi possível autenticar ou ler o armazenamento.

  /health:
    get:
      operationId: getHealth
      tags: [Infraestrutura]
      summary: Verificar se o servidor responde
      description: Não consulta PostgreSQL, Firebase ou Microsoft Graph.
      security: []
      responses:
        "200":
          description: O processo HTTP está respondendo.
          content:
            text/plain:
              schema:
                type: string
                const: O servidor está saudável.
              example: O servidor está saudável.

  /ready:
    get:
      operationId: getReadiness
      tags: [Infraestrutura]
      summary: Verificar a comunicação com PostgreSQL
      description: |
        Executa SELECT 1 AS ok, com limite total de dois segundos para aquisição
        da conexão e execução. Não verifica tabelas, versão do esquema ou
        disponibilidade dos provedores de autenticação. As respostas não têm corpo.
      security: []
      responses:
        "200":
          description: Consulta ao PostgreSQL concluída.
        "503":
          description: Erro de comunicação com PostgreSQL ou tempo limite excedido.

  /auth/institutional/verify:
    post:
      operationId: verifyInstitutionalIdentity
      tags: [Identidade]
      summary: Criar ou renovar a verificação institucional
      description: |
        Exige um Firebase ID token no cabeçalho Authorization e um Microsoft
        access token delegado no corpo. A identidade Microsoft vinculada ao ID
        token deve corresponder ao perfil obtido no Graph.

        O backend consulta a organização Microsoft, busca a instituição cadastrada
        pelo tenant e usa o grupo dessa instituição em me/checkMemberGroups.
        A ausência de participação no grupo ou de curso não vazio no Graph resulta
        em affiliation.type=nonStudent, sem rejeitar a autenticação. A entrada é
        limitada e não concede direitos de estudante em nenhum CA. jobTitle é
        interpretado como curso somente quando o grupo foi confirmado. Nome pode
        estar ausente e é serializado como null. Curso ausente,
        nulo ou em branco nunca é substituído por informação declarada pelo usuário.
        O e-mail do Graph só é retornado em suggestedEmail se a conta estiver
        incompleta e o endereço estiver disponível. Ele apenas sugere o e-mail do
        formulário, não integra verification, não é persistido e não altera o e-mail
        escolhido em verificações posteriores.

        A resposta inclui user com a conta provisionada e verification com a evidência,
        dispensando GET /auth/session após esta operação. verification inclui institution com o identificador interno, o nome e a
        sigla do cadastro institucional do CApp. A sigla pode ser null. Esse resumo
        não expõe tenant ou grupo Microsoft e não concede permissões nem comprova,
        por si só, vínculo estudantil; o vínculo está em profile.affiliation.

        Não exige uma verificação institucional anterior. O serviço tem timeout
        total de 15 segundos; o cancelamento não garante desfazer uma gravação
        já concluída. Após confrontar as identidades, provisiona uma conta incompleta
        de forma idempotente, preservando o ID, o perfil e o status de contas existentes.
        Não reativa contas inativas. Perfil e credencial interna são concluídos separadamente.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        description: Credencial Microsoft da mesma identidade vinculada ao Firebase.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionalAuthRequest"
            examples:
              institutionalAuthRequest:
                summary: Requisição de verificação institucional
                externalValue: ./examples/institutional-auth-request.json
      responses:
        "200":
          description: Identidade verificada e evidência institucional persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalAuthResponse"
              examples:
                student:
                  summary: Estudante com curso informado pelo diretório
                  externalValue: ./examples/institutional-verification-student.json
                studentWithoutOptionalData:
                  summary: Estudante com curso informado, nome e e-mail nulos e instituição sem sigla
                  externalValue: ./examples/institutional-verification-student-null-fields.json
                nonStudent:
                  summary: Pessoa sem participação no grupo estudantil
                  externalValue: ./examples/institutional-verification-non-student.json
        "400":
          description: |
            bad_request — JSON ausente, malformado, de tipo incompatível ou
            rejeitado pelo extractor (inclusive Content-Type inadequado ou limite
            de corpo excedido); microsoftAccessToken ausente, null ou vazio.
            Todas essas rejeições são normalizadas para HTTP 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Requisição inválida
                  details: null
        "401":
          description: |
            Credenciais inválidas. Códigos possíveis:
            - unauthorized: Authorization ausente, repetido ou Bearer malformado;
            - invalid_token: credencial rejeitada pelo verificador ou pelo Graph;
            - expired_token: ID token Firebase expirado;
            - invalid_microsoft_id: identificador Microsoft vinculado ausente ou inválido;
            - identity_mismatch: ID token e perfil Microsoft representam pessoas diferentes.
          headers:
            WWW-Authenticate:
              description: Desafio Bearer incluído em todas as respostas 401.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: Autenticação necessária
                      details: null
                invalidToken:
                  value:
                    error:
                      code: invalid_token
                      message: Token de autenticação inválido
                      details: null
                expiredToken:
                  value:
                    error:
                      code: expired_token
                      message: Token de autenticação expirado
                      details: null
                invalidMicrosoftId:
                  value:
                    error:
                      code: invalid_microsoft_id
                      message: Identificador Microsoft ausente ou inválido
                      details: null
                identityMismatch:
                  value:
                    error:
                      code: identity_mismatch
                      message: As identidades autenticadas não correspondem
                      details: null
        "403":
          description: |
            app_check_required ou app_check_invalid — comprovação do aplicativo ausente ou recusada.
            unknown_institution — o tenant Microsoft não corresponde a uma
            instituição cadastrada.
            account_inactive — a conta interna foi desativada e não é reativada pelo login.
            institutional_verification_required — uma verificação concorrente com
            início igual ou posterior já foi persistida para o mesmo UID e esta
            tentativa não a substituiu; repita a verificação institucional.
            Não confirmar o grupo estudantil ou o curso não gera esses erros; a resposta
            é 200 com o vínculo nonStudent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unknownInstitution:
                  externalValue: ./examples/api-error-unknown-institution.json
                concurrentVerification:
                  value:
                    error:
                      code: institutional_verification_required
                      message: É necessário verificar novamente seu vínculo institucional.
                      details: null
        "500":
          description: internal_server_error — falha interna, inclusive de persistência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_server_error
                  message: Erro interno do servidor
                  details: null
        "503":
          description: |
            app_check_unavailable — não foi possível obter chaves válidas do App Check.
            authentication_provider_unavailable — falha de comunicação, resposta
            inesperada ou indisponibilidade de Firebase/JWKS ou Microsoft Graph.
            service_unavailable — timeout total de 15 segundos do serviço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                providerUnavailable:
                  value:
                    error:
                      code: authentication_provider_unavailable
                      message: Serviço de autenticação temporariamente indisponível
                      details: null
                timeout:
                  value:
                    error:
                      code: service_unavailable
                      message: Serviço temporariamente indisponível
                      details: null


  /auth/session:
    get:
      operationId: restoreAccountSession
      tags: [Identidade]
      summary: Restaurar a conta interna e a confirmação institucional vigente
      description: |
        Valida o ID token Firebase e consulta a conta provisionada. Não consulta o
        Graph nem exige access token Microsoft. verification é null quando a evidência
        expirou ou sua configuração institucional mudou; o perfil interno é preservado.
        Uma conta incompleta também pode restaurar sua sessão para concluir o cadastro.
        Conta ausente retorna 404 account_not_provisioned; inativa, 403 account_inactive.
        Após autenticar, o cliente consulta esta rota antes de obter credencial Microsoft:
        somente ausência de conta ou de evidência vigente exige verificação institucional.
        Falhas de comunicação e recusas não devem ser interpretadas como conta ausente.
        O timeout total é de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Conta restaurada; evidência nula exige sincronização Microsoft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
              example:
                user:
                  id: "00000000-0000-0000-0000-000000000010"
                  status: active
                  nickname: Pessoa
                  email: escolhido@example.test
                  currentSemester: 4
                  institutionEntrySemester: "2023.2"
                verification: null
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Identidade autenticada ainda sem conta CApp; requer primeira verificação institucional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_not_provisioned
                  message: Esta identidade ainda não possui uma conta no CApp
                  details: null
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

  /users/me/profile:
    put:
      operationId: completeUserProfile
      tags: [Identidade]
      summary: Concluir ou atualizar o perfil da conta autenticada
      description: |
        Exige ID token Firebase originado de autenticação password, com a credencial
        vinculada ao mesmo UID da Microsoft, e confirmação institucional vigente.
        Não recebe senha, UID, status ou e-mail de login no corpo. O e-mail interno vem do JWT
        validado, podendo ser diferente do institucional. Apelido, período atual e
        semestre de ingresso são obrigatórios. O apelido é aparado.
        name é um complemento opcional declarado pelo usuário, aceito somente
        quando o Graph retornou null para o nome. Não substitui a evidência
        institucional. Curso e e-mail institucional não são aceitos no formulário.
        O e-mail escolhido é confirmado pelo Firebase, independente da sugestão Graph.
        Concluir o perfil muda Incomplete para Active, sem reativar contas inativas.
        Repetir a atualização preserva ID e a data da primeira conclusão.
        Apelido não é tratado como identificador único. Timeout total de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileRequest"
            example:
              nickname: Pessoa
              currentSemester: 4
              institutionEntrySemester: "2023.2"
      responses:
        "200":
          description: Perfil completo e conta ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
              example:
                id: "00000000-0000-0000-0000-000000000010"
                status: active
                nickname: Pessoa
                email: escolhido@example.test
                currentSemester: 4
                institutionEntrySemester: "2023.2"
        "400":
          description: JSON inválido, campos extras ou dados inválidos (invalid_profile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: app_check_required, app_check_invalid, password_required, institutional_verification_required ou account_inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"
