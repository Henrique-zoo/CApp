        - FirebaseIdToken: []
          FirebaseAppCheck: []
      parameters:
        - name: academic_center_id
          in: path
          required: true
          description: Identificador único (UUID) do Centro Acadêmico responsável pela demanda.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
