  /api/v1/academic-centers/{academic_center_id}/faq:
    get:
      operationId: listFaqEntries
      tags: [FAQ]
      summary: Consultar e pesquisar perguntas frequentes do Centro Acadêmico
      description: |
        Retorna a listagem de perguntas e respostas cadastradas no FAQ do Centro Acadêmico.
        Suporta filtragem opcional por categoria temática e busca textual case-insensitive
        por palavra-chave na pergunta e na resposta. Retorna lista vazia caso nenhum registro
        corresponda aos critérios informados.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      parameters:
        - name: academic_center_id
          in: path
          required: true
          description: Identificador único (UUID) do Centro Acadêmico.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        - name: category
          in: query
          required: false
          description: Filtro opcional por categoria temática.
          schema:
            type: string
          example: Carteirinhas
        - name: q
          in: query
          required: false
          description: Termo de busca textual opcional em perguntas e respostas.
          schema:
            type: string
          example: carteirinha
        - name: search
          in: query
          required: false
          description: Alias para o parâmetro de busca textual `q`.
          schema:
            type: string
          example: carteirinha
      responses:
        "200":
          description: Lista de perguntas e respostas de FAQ do Centro Acadêmico.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqEntryResponse"
              examples:
                faqListWithEntries:
                  summary: Lista de perguntas frequentes
                  value:
                    - id: "00000000-0000-0000-0000-000000000010"
                      academicCenterId: "00000000-0000-0000-0000-000000000001"
                      question: Como solicito a carteirinha de estudante do CA?
                      answer: A carteirinha de estudante pode ser solicitada diretamente no balcão de atendimento do CA ou pelo formulário online disponível no início de cada semestre letivo.
                      category: Carteirinhas
                      createdBy: "00000000-0000-0000-0000-000000000020"
                      updatedBy: "00000000-0000-0000-0000-000000000020"
                      createdAt: "2026-11-22T13:00:00Z"
                      updatedAt: "2026-11-22T13:00:00Z"
                faqListEmpty:
                  summary: Nenhuma pergunta frequente encontrada
                  value: []
        "400":
          description: |
            bad_request — Parâmetros de consulta inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
