openapi: 3.1.0

info:
  title: CApp API
  version: 5.1.0
  description: |
    Contrato das rotas atualmente implementadas no backend CApp.
    Os caminhos são servidos sem prefixo /v1.
    Desde 2.0.0, rotas de negócio exigem X-Firebase-AppCheck além do Firebase
    ID token. O servidor verifica assinatura, emissor, audiência, validade e
    App ID permitido. app_check_required e app_check_invalid retornam 403;
    app_check_unavailable retorna 503. /health e /ready dispensam ambos os tokens.
    Desde 3.0.0, POST /auth/institutional/verify retorna user e verification
    no mesmo envelope.
    Desde 4.0.0, o vínculo student exige curso institucional não vazio e o
    perfil interno não aceita courseName declarado pelo usuário. O e-mail do Graph
    é retornado apenas como suggestedEmail durante o cadastro, fora da evidência
    institucional, e não é persistido. Contas ativas preservam o e-mail escolhido.
    A partir de 4.1.0, as leituras do quadro eleitoral e de seu checkpoint são públicas.
    A versão 4.2.0 acrescenta o cadastro privado da chave quando a eleição o exige.
    A versão 4.3.0 recebe cédulas cifradas e assinadas no dispositivo.

    A verificação institucional valida um Firebase ID token e um Microsoft access
    token da mesma pessoa, consulta a instituição pelo tenant Microsoft, verifica
    a participação no grupo estudantil e persiste a evidência por 120 dias.
    Estudantes e não estudantes podem concluir a verificação. Ela provisiona
    uma conta interna incompleta por UID Firebase, sem criar credenciais ou conceder permissões
    específicas de curso. A expiração informada é da evidência institucional,
    independente da expiração do ID token Firebase.

tags:
  - name: Infraestrutura
    description: Saúde do processo e comunicação com PostgreSQL.
  - name: Identidade
    description: Verificação das credenciais e do vínculo institucional.
  - name: Eleições
    description: Distribuição de evidências para verificação pelos eleitores e autoridades.

  - name: Materiais
    description: Publicação e consulta de materiais acadêmicos no contexto de um CA.

paths:
  /materials/contexts:
    get:
      operationId: listMaterialContexts
      tags: [Materiais]
      summary: Listar Centros Acadêmicos acessíveis à conta
      description: |
        Retorna CAs ativos da instituição da evidência estudantil vigente.
        As capacidades são informativas e avaliadas novamente na publicação.
        Uma conta autenticada sem contexto elegível recebe uma lista vazia.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Contextos acessíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialContext"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
  /academic-centers/{caId}/materials:
    parameters:
      - $ref: "#/components/parameters/MaterialCenterId"
    get:
      operationId: listAcademicMaterials
      tags: [Materiais]
      summary: Listar materiais publicados de um Centro Acadêmico
      description: A ordem é de publicação decrescente, com desempate por UUID.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      parameters:
        - name: disciplineId
          in: query
          description: Disciplina do catálogo deste CA.
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          description: Quantidade máxima de materiais na página.
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
        - name: offset
          in: query
          description: Posição inicial da página retornada em nextOffset.
          schema: {type: integer, minimum: 0, maximum: 4294967295, default: 0}
      responses:
        "200":
          description: Página de materiais publicados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMaterialPage"
        "400":
          $ref: "#/components/responses/MaterialInvalid"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
    post:
      operationId: publishAcademicMaterial
      tags: [Materiais]
      summary: Publicar um link externo ou PDF em um Centro Acadêmico
      description: |
        Exige a permissão Gerenciar materiais no CA da rota e vínculo estudantil vigente.
        O servidor deriva a autoria da conta autenticada. A disciplina deve pertencer
        ao catálogo desse CA. O mesmo Idempotency-Key e conteúdo recuperam a publicação
        anterior. A chave é vinculada à conta e ao CA. Um PDF só é publicado após
        concluir o armazenamento. O limite é de 10485760 bytes incluindo o tamanho exato.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID estável em repetição da mesma publicação.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMaterialLink"
            example:
              title: Referências de Cálculo I
              description: Material de apoio para a primeira avaliação.
              disciplineId: "9d152145-f841-4b7a-8abb-98ed5f0f4762"
              content:
                type: external_link
                url: https://exemplo.edu.br/calculo
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              additionalProperties: false
              properties:
                metadata:
                  type: string
                  description: JSON codificado como texto com title, description e disciplineId.
                  contentMediaType: application/json
                  contentSchema:
                    $ref: "#/components/schemas/MaterialMetadata"
                file:
                  type: string
                  format: binary
                  description: PDF com até 10485760 bytes e nome com extensão .pdf.
            encoding:
              file:
                contentType: application/pdf
      responses:
        "200":
          $ref: "#/components/responses/MaterialPublished"
        "201":
          $ref: "#/components/responses/MaterialPublished"
        "400":
          $ref: "#/components/responses/MaterialInvalid"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "409":
          description: Chave já usada com outro conteúdo (material_request_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: PDF acima do limite (material_pdf_too_large).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Tipo HTTP de publicação não aceito (unsupported_material_media_type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
  /academic-centers/{caId}/materials/disciplines:
    parameters:
      - $ref: "#/components/parameters/MaterialCenterId"
    get:
      operationId: listMaterialDisciplines
      tags: [Materiais]
      summary: Listar disciplinas disponíveis para materiais do CA
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Catálogo do CA, inclusive disciplinas sem materiais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialDiscipline"
        "400":
          $ref: "#/components/responses/MaterialInvalid"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
  /academic-centers/{caId}/materials/{materialId}:
    parameters:
      - $ref: "#/components/parameters/MaterialCenterId"
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: getPublishedMaterial
      tags: [Materiais]
      summary: Ler detalhes de um material publicado no CA
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Material disponível para consulta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMaterial"
        "400":
          $ref: "#/components/responses/MaterialInvalid"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "404":
          $ref: "#/components/responses/PublishedMaterialNotFound"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
  /academic-centers/{caId}/materials/{materialId}/file:
    parameters:
      - $ref: "#/components/parameters/MaterialCenterId"
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: downloadMaterialPdf
      tags: [Materiais]
      summary: Baixar o PDF de um material publicado no CA
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: PDF publicado entregue como anexo privado.
          headers:
            Content-Disposition:
              description: Indica que o PDF é um anexo.
              schema: {type: string}
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/MaterialInvalid"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/MaterialAccessDenied"
        "404":
          $ref: "#/components/responses/PublishedMaterialNotFound"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/MaterialUnavailable"
  /elections/{id}/ballots:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    post:
      operationId: submitSecretBallot
      tags: [Eleições]
      summary: Registrar voto secreto e obter o recibo assinado
      description: |
        Enviar as cifras na ordem do manifesto, a chave pública e a assinatura.
        A assinatura usa o payload público Ballot v1, sem kind nem version,
        com electionId da rota e accountId da conta autenticada.
        O corpo transporta somente manifestHash, publicKey e ciphertexts no payload.
        O backend reconstitui os campos restantes para verificar a assinatura.
        A entrada é CAPP-ELECTIONS/BALLOT/1, um byte NUL e o payload público em JCS.
        O eleitor precisa ter vínculo vigente com um curso representado pelo CA. A chave é cadastrada
        antes da abertura quando exigido ou vinculada no primeiro voto aceito.
        Se a resposta se perder, o mesmo hash do conteúdo assinado recupera as
        evidências originais, inclusive após o encerramento.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./elections/schemas.json#/$defs/SignedBallotSubmission"
            examples:
              signedBallot:
                externalValue: ./examples/election-ballot-submission.json
      responses:
        "201":
          description: Primeiro aceite. Registro e recibo confirmados no mesmo commit (recovered é false).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RecordedBallot"
                  - type: object
                    properties:
                      recovered:
                        const: false
        "200":
          description: Reenvio de cédula já confirmada. O registro e o recibo são os originais (recovered é true).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RecordedBallot"
                  - type: object
                    properties:
                      recovered:
                        const: true
        "400":
          description: UUID inválido ou cédula recusada por formato, assinatura ou contexto.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta, o App Check ou a elegibilidade eleitoral impedem a submissão.
        "404":
          description: Eleição desconhecida ou conta ainda não provisionada.
        "409":
          description: Prazo, cadastro prévio ausente, chave divergente, participação anterior ou limite de participantes.
        "413":
          description: O envelope excede 262144 bytes.
        "415":
          description: O servidor exige application/json.
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação, emissão de recibo ou armazenamento indisponível.

  /elections/{id}/authority/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: readOwnElectionAuthority
      tags: [Eleições]
      summary: Consultar a designação de autoridade da própria conta
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não foi designada para a eleição.
    put:
      operationId: registerOwnElectionAuthority
      tags: [Eleições]
      summary: Entregar a chave pública e a prova da autoridade
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedAuthorityRegistration"
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "400":
          description: Assinatura, prova ou envelope inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não corresponde à designação.
        "409":
          description: Preparação encerrada ou chave diferente já registrada.
  /elections/{id}/manifest:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: publishElectionManifest
      tags: [Eleições]
      summary: Publicar o manifesto confidencial da comissão designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionAuthorityAssignment"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Preparação encerrada ou credenciais de autoridades pendentes.
  /elections/{id}/period:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: updateElectionPeriod
      tags: [Eleições]
      summary: Adiar a abertura ou prorrogar o fim da votação
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionPeriodChange"
      responses:
        "200":
          description: Período vigente confirmado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionPeriod"
        "400":
          description: Período ou motivo inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Eleição cancelada ou já encerrada.
  /elections/{id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    put:
      operationId: cancelElection
      tags: [Eleições]
      summary: Cancelar a eleição pela comissão designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionCancellationRequest"
      responses:
        "200":
          description: Cancelamento confirmado. Repetições devolvem o cancelamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionCancellation"
        "400":
          description: Motivo inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: A conta não representa a comissão da eleição.
        "409":
          description: Eleição já encerrada.
  /elections/{id}/tally:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: readElectionTally
      tags: [Eleições]
      summary: Consultar contribuições e resultado da apuração
      security: []
      responses:
        "200":
          description: Evidências públicas da eleição encerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionTally"
        "404":
          description: Quadro eleitoral inexistente.
        "409":
          description: A votação ainda não foi encerrada.
  /elections/{id}/tally/shares/{authority}:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
      - name: authority
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: submitElectionDecryptionShare
      tags: [Eleições]
      summary: Entregar a contribuição assinada de uma autoridade designada
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedShare"
      responses:
        "200":
          description: Estado confirmado da apuração após a entrega.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionTally"
        "400":
          description: Prova, assinatura ou vínculo com o encerramento inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: Conta sem atribuição ou origem do aplicativo recusada.
        "409":
          description: Quadro aberto ou contribuição definitiva já aceita.

  /elections/{id}/board:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoard
      tags: [Eleições]
      summary: Exportar o quadro eleitoral público
      description: Retorna uma única fotografia confirmada, com os registros em ordem de aceite.
      security: []
      responses:
        "200":
          description: Evidências públicas do protocolo eleitoral v1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionBoardSnapshot"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/board/checkpoint:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getElectionBoardCheckpoint
      tags: [Eleições]
      summary: Obter a âncora atual do quadro
      description: Guardar fora do servidor para comparar com uma exportação posterior da mesma eleição.
      security: []
      responses:
        "200":
          description: Último recibo assinado, ou o manifesto assinado quando o quadro está vazio.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "./elections/schemas.json#/$defs/SignedManifest"
                  - $ref: "./elections/schemas.json#/$defs/SignedReceipt"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "404":
          $ref: "#/components/responses/BoardNotFound"
        "500":
          description: Falha de consistência nas evidências armazenadas.
        "503":
          description: Falha ao ler o armazenamento eleitoral.

  /elections/{id}/registration/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getOwnElectionRegistration
      tags: [Eleições]
      summary: Consultar o cadastro e a participação da própria conta
      description: Informa se a eleição exige cadastro prévio e permite consultar a situação após o encerramento.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          $ref: "#/components/responses/ElectionRegistration"
        "400":
          description: Identificador da eleição inválido.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          $ref: "#/components/responses/RegistrationNotFound"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação ou armazenamento indisponível.
    put:
      operationId: registerOwnElectionKey
      tags: [Eleições]
      summary: Cadastrar a chave pública do eleitor antes da abertura
      description: |
        Assinar o payload com RSA-PSS/SHA-256 (MGF1-SHA-256, salt de 32 bytes)
        sobre o prefixo CAPP-ELECTIONS/REGISTRATION/1, um byte NUL e o JSON canônico RFC 8785.
        O corpo transporta a chave pública e a assinatura. O backend reconstrói
        o payload assinado com a versão e o tipo fixos, a eleição da rota e o UUID
        interno da conta autenticada. Repetir o cadastro confirmado
        com a mesma chave recupera a inscrição. O servidor mantém o vínculo original.
        A operação se aplica às eleições que exigem cadastro prévio.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionRegistrationProof"
            examples:
              signedRegistration:
                externalValue: ./examples/election-voter-registration.json
      responses:
        "200":
          $ref: "#/components/responses/ElectionRegistration"
        "400":
          description: Identificador inválido ou prova de posse inválida (invalid_registration_proof).
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: App Check, conta ou elegibilidade institucional recusados.
        "404":
          $ref: "#/components/responses/RegistrationNotFound"
        "409":
          description: Cadastro dispensado (registration_not_required), encerrado (registration_closed) ou chave diferente da original (registration_key_conflict).
        "413":
          description: O corpo excede 262144 bytes.
        "415":
          description: O servidor exige application/json.
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          description: Autenticação ou armazenamento indisponível.

  /elections/{id}/receipts/me:
    parameters:
      - $ref: "#/components/parameters/ElectionId"
    get:
      operationId: getOwnElectionReceipt
      tags: [Eleições]
      summary: Recuperar o recibo original da conta autenticada
      description: Aceita a consulta depois do encerramento e da expiração da elegibilidade eleitoral.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Recibo assinado e persistido quando a cédula foi aceita.
          content:
            application/json:
              schema:
                $ref: "./elections/schemas.json#/$defs/SignedReceipt"
        "400":
          description: O identificador da eleição precisa ser um UUID.
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Conta ainda não provisionada ou sem recibo nessa eleição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Falha interna ao resolver a conta ou o recibo.
        "503":
          description: Não foi possível autenticar ou ler o armazenamento.

  /health:
    get:
      operationId: getHealth
      tags: [Infraestrutura]
      summary: Verificar se o servidor responde
      description: Não consulta PostgreSQL, Firebase ou Microsoft Graph.
      security: []
      responses:
        "200":
          description: O processo HTTP está respondendo.
          content:
            text/plain:
              schema:
                type: string
                const: O servidor está saudável.
              example: O servidor está saudável.

  /ready:
    get:
      operationId: getReadiness
      tags: [Infraestrutura]
      summary: Verificar a comunicação com PostgreSQL
      description: |
        Executa SELECT 1 AS ok, com limite total de dois segundos para aquisição
        da conexão e execução. Não verifica tabelas, versão do esquema ou
        disponibilidade dos provedores de autenticação. As respostas não têm corpo.
      security: []
      responses:
        "200":
          description: Consulta ao PostgreSQL concluída.
        "503":
          description: Erro de comunicação com PostgreSQL ou tempo limite excedido.

  /auth/institutional/verify:
    post:
      operationId: verifyInstitutionalIdentity
      tags: [Identidade]
      summary: Criar ou renovar a verificação institucional
      description: |
        Exige um Firebase ID token no cabeçalho Authorization e um Microsoft
        access token delegado no corpo. A identidade Microsoft vinculada ao ID
        token deve corresponder ao perfil obtido no Graph.

        O backend consulta a organização Microsoft, busca a instituição cadastrada
        pelo tenant e usa o grupo dessa instituição em me/checkMemberGroups.
        A ausência de participação no grupo ou de curso não vazio no Graph resulta
        em affiliation.type=nonStudent, sem rejeitar a autenticação. A entrada é
        limitada e não concede direitos de estudante em nenhum CA. jobTitle é
        interpretado como curso somente quando o grupo foi confirmado. Nome pode
        estar ausente e é serializado como null. Curso ausente,
        nulo ou em branco nunca é substituído por informação declarada pelo usuário.
        O e-mail do Graph só é retornado em suggestedEmail se a conta estiver
        incompleta e o endereço estiver disponível. Ele apenas sugere o e-mail do
        formulário, não integra verification, não é persistido e não altera o e-mail
        escolhido em verificações posteriores.

        A resposta inclui user com a conta provisionada e verification com a evidência,
        dispensando GET /auth/session após esta operação. verification inclui institution com o identificador interno, o nome e a
        sigla do cadastro institucional do CApp. A sigla pode ser null. Esse resumo
        não expõe tenant ou grupo Microsoft e não concede permissões nem comprova,
        por si só, vínculo estudantil; o vínculo está em profile.affiliation.

        Não exige uma verificação institucional anterior. O serviço tem timeout
        total de 15 segundos; o cancelamento não garante desfazer uma gravação
        já concluída. Após confrontar as identidades, provisiona uma conta incompleta
        de forma idempotente, preservando o ID, o perfil e o status de contas existentes.
        Não reativa contas inativas. Perfil e credencial interna são concluídos separadamente.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        description: Credencial Microsoft da mesma identidade vinculada ao Firebase.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionalAuthRequest"
            examples:
              institutionalAuthRequest:
                summary: Requisição de verificação institucional
                externalValue: ./examples/institutional-auth-request.json
      responses:
        "200":
          description: Identidade verificada e evidência institucional persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalAuthResponse"
              examples:
                student:
                  summary: Estudante com curso informado pelo diretório
                  externalValue: ./examples/institutional-verification-student.json
                studentWithoutOptionalData:
                  summary: Estudante com curso informado, nome e e-mail nulos e instituição sem sigla
                  externalValue: ./examples/institutional-verification-student-null-fields.json
                nonStudent:
                  summary: Pessoa sem participação no grupo estudantil
                  externalValue: ./examples/institutional-verification-non-student.json
        "400":
          description: |
            bad_request — JSON ausente, malformado, de tipo incompatível ou
            rejeitado pelo extractor (inclusive Content-Type inadequado ou limite
            de corpo excedido); microsoftAccessToken ausente, null ou vazio.
            Todas essas rejeições são normalizadas para HTTP 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Requisição inválida
                  details: null
        "401":
          description: |
            Credenciais inválidas. Códigos possíveis:
            - unauthorized: Authorization ausente, repetido ou Bearer malformado;
            - invalid_token: credencial rejeitada pelo verificador ou pelo Graph;
            - expired_token: ID token Firebase expirado;
            - invalid_microsoft_id: identificador Microsoft vinculado ausente ou inválido;
            - identity_mismatch: ID token e perfil Microsoft representam pessoas diferentes.
          headers:
            WWW-Authenticate:
              description: Desafio Bearer incluído em todas as respostas 401.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: Autenticação necessária
                      details: null
                invalidToken:
                  value:
                    error:
                      code: invalid_token
                      message: Token de autenticação inválido
                      details: null
                expiredToken:
                  value:
                    error:
                      code: expired_token
                      message: Token de autenticação expirado
                      details: null
                invalidMicrosoftId:
                  value:
                    error:
                      code: invalid_microsoft_id
                      message: Identificador Microsoft ausente ou inválido
                      details: null
                identityMismatch:
                  value:
                    error:
                      code: identity_mismatch
                      message: As identidades autenticadas não correspondem
                      details: null
        "403":
          description: |
            app_check_required ou app_check_invalid — comprovação do aplicativo ausente ou recusada.
            unknown_institution — o tenant Microsoft não corresponde a uma
            instituição cadastrada.
            account_inactive — a conta interna foi desativada e não é reativada pelo login.
            institutional_verification_required — uma verificação concorrente com
            início igual ou posterior já foi persistida para o mesmo UID e esta
            tentativa não a substituiu; repita a verificação institucional.
            Não confirmar o grupo estudantil ou o curso não gera esses erros; a resposta
            é 200 com o vínculo nonStudent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unknownInstitution:
                  externalValue: ./examples/api-error-unknown-institution.json
                concurrentVerification:
                  value:
                    error:
                      code: institutional_verification_required
                      message: É necessário verificar novamente seu vínculo institucional.
                      details: null
        "500":
          description: internal_server_error — falha interna, inclusive de persistência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_server_error
                  message: Erro interno do servidor
                  details: null
        "503":
          description: |
            app_check_unavailable — não foi possível obter chaves válidas do App Check.
            authentication_provider_unavailable — falha de comunicação, resposta
            inesperada ou indisponibilidade de Firebase/JWKS ou Microsoft Graph.
            service_unavailable — timeout total de 15 segundos do serviço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                providerUnavailable:
                  value:
                    error:
                      code: authentication_provider_unavailable
                      message: Serviço de autenticação temporariamente indisponível
                      details: null
                timeout:
                  value:
                    error:
                      code: service_unavailable
                      message: Serviço temporariamente indisponível
                      details: null


  /auth/session:
    get:
      operationId: restoreAccountSession
      tags: [Identidade]
      summary: Restaurar a conta interna e a confirmação institucional vigente
      description: |
        Valida o ID token Firebase e consulta a conta provisionada. Não consulta o
        Graph nem exige access token Microsoft. verification é null quando a evidência
        expirou ou sua configuração institucional mudou; o perfil interno é preservado.
        Uma conta incompleta também pode restaurar sua sessão para concluir o cadastro.
        Conta ausente retorna 404 account_not_provisioned; inativa, 403 account_inactive.
        Após autenticar, o cliente consulta esta rota antes de obter credencial Microsoft:
        somente ausência de conta ou de evidência vigente exige verificação institucional.
        Falhas de comunicação e recusas não devem ser interpretadas como conta ausente.
        O timeout total é de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      responses:
        "200":
          description: Conta restaurada; evidência nula exige sincronização Microsoft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionResponse"
              example:
                user:
                  id: "00000000-0000-0000-0000-000000000010"
                  status: active
                  nickname: Pessoa
                  email: escolhido@example.test
                  currentSemester: 4
                  institutionEntrySemester: "2023.2"
                verification: null
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          $ref: "#/components/responses/AccountAccessDenied"
        "404":
          description: Identidade autenticada ainda sem conta CApp; requer primeira verificação institucional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_not_provisioned
                  message: Esta identidade ainda não possui uma conta no CApp
                  details: null
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

  /users/me/profile:
    put:
      operationId: completeUserProfile
      tags: [Identidade]
      summary: Concluir ou atualizar o perfil da conta autenticada
      description: |
        Exige ID token Firebase originado de autenticação password, com a credencial
        vinculada ao mesmo UID da Microsoft, e confirmação institucional vigente.
        Não recebe senha, UID, status ou e-mail de login no corpo. O e-mail interno vem do JWT
        validado, podendo ser diferente do institucional. Apelido, período atual e
        semestre de ingresso são obrigatórios. O apelido é aparado.
        name é um complemento opcional declarado pelo usuário, aceito somente
        quando o Graph retornou null para o nome. Não substitui a evidência
        institucional. Curso e e-mail institucional não são aceitos no formulário.
        O e-mail escolhido é confirmado pelo Firebase, independente da sugestão Graph.
        Concluir o perfil muda Incomplete para Active, sem reativar contas inativas.
        Repetir a atualização preserva ID e a data da primeira conclusão.
        Apelido não é tratado como identificador único. Timeout total de 15 segundos.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileRequest"
            example:
              nickname: Pessoa
              currentSemester: 4
              institutionEntrySemester: "2023.2"
      responses:
        "200":
          description: Perfil completo e conta ativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
              example:
                id: "00000000-0000-0000-0000-000000000010"
                status: active
                nickname: Pessoa
                email: escolhido@example.test
                currentSemester: 4
                institutionEntrySemester: "2023.2"
        "400":
          description: JSON inválido, campos extras ou dados inválidos (invalid_profile).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: app_check_required, app_check_invalid, password_required, institutional_verification_required ou account_inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

components:
  parameters:
    MaterialCenterId:
      name: caId
      in: path
      required: true
      description: UUID do CA selecionado.
      schema: {type: string, format: uuid}
    MaterialId:
      name: materialId
      in: path
      required: true
      description: UUID do material no CA.
      schema: {type: string, format: uuid}
    ElectionId:
      in: path
      name: id
      required: true
      description: UUID não nulo da eleição, conforme publicado no manifesto.
      schema:
        type: string
        format: uuid
  responses:
    MaterialPublished:
      description: Retorna 201 ao publicar e 200 ao recuperar uma publicação idempotente.
      headers:
        Location:
          description: Caminho absoluto do recurso no servidor.
          schema: {type: string, format: uri-reference}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublishedMaterial"
    MaterialInvalid:
      description: Entrada inválida, chave ausente, URL, disciplina ou PDF rejeitado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    MaterialAccessDenied:
      description: App Check, conta indisponível ou acesso ao contexto ou à publicação recusado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PublishedMaterialNotFound:
      description: Material publicado ou PDF não localizado no contexto solicitado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    MaterialUnavailable:
      description: Indisponibilidade temporária da identidade, atestado, banco ou armazenamento.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ElectionAuthorityAssignment:
      description: Designação confirmada da própria conta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ElectionAuthorityAssignment"
    ElectionRegistration:
      description: Cadastro e participação da conta autenticada nesta eleição.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ElectionRegistrationStatus"
    RegistrationNotFound:
      description: Eleição desconhecida ou conta interna ainda não provisionada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BoardNotFound:
      description: A eleição ainda não possui quadro publicado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidAccountCredential:
      description: Credencial Firebase ausente, inválida, expirada ou identidade divergente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountAccessDenied:
      description: app_check_required, app_check_invalid, institutional_verification_required ou account_inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountInternalError:
      description: Falha interna; nenhum diagnóstico ou credencial é exposto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountServiceUnavailable:
      description: app_check_unavailable, serviço indisponível ou timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    FirebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: |
        JWT Firebase App Check emitido para um App ID permitido do mesmo projeto.
        Nas rotas autenticadas, envie exatamente um cabeçalho. A ausência retorna
        403 com app_check_required. Um cabeçalho duplicado ou um JWT recusado
        retorna 403 com app_check_invalid.
        O SDK troca o token de depuração do Console pelo JWT exigido pela API.
        Saúde, prontidão, quadro eleitoral, checkpoint e apuração são públicos.
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token do projeto configurado no backend, com identidade
        microsoft.com vinculada. Enviar um único Authorization: Bearer <ID_TOKEN>.
        O access token Microsoft é enviado separadamente no corpo da verificação.
  schemas:
    MaterialContext:
      type: object
      required: [id, name, canPublish, canUploadPdf]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        canPublish: {type: boolean}
        canUploadPdf: {type: boolean}
    MaterialDiscipline:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    MaterialMetadata:
      type: object
      required: [title, description, disciplineId]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        disciplineId: {type: string, format: uuid}
    PublishMaterialLink:
      type: object
      required: [title, description, disciplineId, content]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        disciplineId: {type: string, format: uuid}
        content:
          $ref: "#/components/schemas/ExternalMaterialLink"
    ExternalMaterialLink:
      type: object
      required: [type, url]
      additionalProperties: false
      properties:
        type: {const: external_link}
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Endereço HTTP ou HTTPS absoluto, sem credenciais.
    MaterialPdf:
      type: object
      required: [type, fileName, sizeBytes]
      additionalProperties: false
      properties:
        type: {const: file}
        fileName: {type: string, minLength: 1, maxLength: 255}
        sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
    PublishedMaterial:
      type: object
      required: [id, caId, disciplineId, title, description, createdAt, content]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        caId: {type: string, format: uuid}
        disciplineId: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        createdAt: {type: string, format: date-time}
        content:
          oneOf:
            - $ref: "#/components/schemas/ExternalMaterialLink"
            - $ref: "#/components/schemas/MaterialPdf"
    PublishedMaterialPage:
      type: object
      required: [items, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublishedMaterial"
        nextOffset:
          type: [integer, "null"]
          minimum: 0
          maximum: 4294967295
    RecordedBallot:
      $ref: "./elections/schemas.json#/$defs/RecordedBallot"
    ElectionRegistrationProof:
      $ref: "./elections/registration-request.schema.json"
    ElectionRegistrationStatus:
      $ref: "./elections/schemas.json#/$defs/VoterRegistrationStatus"
    ElectionPeriod:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
    ElectionPeriodChange:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, reason]
      properties:
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Pode ser adiado antes da abertura. Após abrir, preserve o início vigente.
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Deve ser posterior ao encerramento vigente.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionCancellation:
      type: object
      additionalProperties: false
      required: [cancelledAt, cancelledBy, reason]
      properties:
        cancelledAt:
          type: string
          format: date-time
        cancelledBy:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionAuthorityAssignment:
      type: object
      additionalProperties: false
      required: [authorityId, role, slateId, registered, startsAt, endsAt, cancelled, manifestHash]
      properties:
        authorityId:
          $ref: "./elections/schemas.json#/$defs/Uuid"
        role:
          enum: [commission, slate]
        slateId:
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/Uuid"
            - type: "null"
        registered:
          type: boolean
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        cancelled:
          type: boolean
        manifestHash:
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/Hash"
            - type: "null"
    SignedAuthorityRegistration:
      $ref: "./elections/schemas.json#/$defs/SignedAuthorityRegistration"
    SignedShare:
      $ref: "./elections/schemas.json#/$defs/SignedDecryptionShare"
    SignedTallyResult:
      $ref: "./elections/schemas.json#/$defs/SignedResult"
    ElectionTally:
      type: object
      additionalProperties: false
      required: [shares, result]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/SignedShare"
        result:
          description: Resultado assinado. Nulo enquanto nenhuma autoridade contribuiu.
          anyOf:
            - $ref: "#/components/schemas/SignedTallyResult"
            - type: "null"
    ElectionBoardSnapshot:
      type: object
      additionalProperties: false
      required: [manifest, startsAt, endsAt, entries, checkpoint, closure, aggregate]
      properties:
        manifest:
          $ref: "./elections/schemas.json#/$defs/SignedManifest"
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Início do período de votação vigente informado pela eleição.
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Fim do período de votação vigente informado pela eleição.
        entries:
          type: array
          items:
            $ref: "./elections/schemas.json#/$defs/SignedBoardEntry"
        checkpoint:
          description: Último recibo confirmado. Nulo antes do primeiro voto.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedReceipt"
            - type: "null"
        closure:
          description: Termo assinado ao encerrar a votação.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedClosure"
            - type: "null"
        aggregate:
          description: Produto das cifras vinculado ao termo de encerramento.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedAggregate"
            - type: "null"
        cancellation:
          $ref: "#/components/schemas/ElectionCancellation"
    InternalUserResponse:
      type: object
      required: [id, status, nickname, email, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Nome declarado para uma ausência do Graph; não é evidência institucional.
        id:
          type: string
          format: uuid
          description: ID interno estável, compartilhado entre os provedores vinculados no Firebase.
        status:
          type: string
          enum: [incomplete, active, inactive]
        nickname:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
          description: E-mail escolhido para a credencial interna; não é necessariamente institucional.
        currentSemester:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: Período atual do curso, independente do tempo desde o ingresso.
        institutionEntrySemester:
          type: [string, "null"]
          pattern: '^[0-9]{4}\.[12]$'
          description: Semestre de ingresso na instituição, como 2023.2.
      allOf:
        - if:
            properties:
              status:
                const: active
          then:
            properties:
              id: {}
              status: {}
              nickname:
                type: string
                pattern: '\S'
              email:
                type: string
                minLength: 1
              currentSemester:
                type: integer
              institutionEntrySemester:
                type: string
    InstitutionalAuthResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          $ref: "#/components/schemas/InstitutionalVerificationResponse"
        suggestedEmail:
          type: string
          format: email
          minLength: 1
          description: Sugestão transitória do Graph para o cadastro. Omitida se indisponível ou a conta não estiver Incomplete. Não integra a verificação nem os caches.
      allOf:
        - if:
            properties:
              user:
                properties:
                  status:
                    enum: [active, inactive]
          then:
            not:
              properties:
                suggestedEmail: {}
              required: [suggestedEmail]

    AccountSessionResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          oneOf:
            - $ref: "#/components/schemas/InstitutionalVerificationResponse"
            - type: "null"
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Complemento opcional, aceito somente se o nome do Graph for null.
        nickname:
          type: string
          minLength: 1
          pattern: '\S'
          description: Apelido obrigatório, aparado antes de persistir.
        currentSemester:
          type: integer
          minimum: 1
          maximum: 2147483647
        institutionEntrySemester:
          type: string
          pattern: '^[0-9]{4}\.[12]$'
    InstitutionalAuthRequest:
      type: object
      required: [microsoftAccessToken]
      properties:
        microsoftAccessToken:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Access token delegado para consultar organização, perfil e participação
            em grupos no Microsoft Graph. Não é um Firebase ID token. Strings vazias
            são rejeitadas; o backend não aplica trim antes de consultar o provedor.
    InstitutionalVerificationResponse:
      type: object
      required: [profile, institution, expiresAt]
      properties:
        profile:
          $ref: "#/components/schemas/InstitutionalIdentityResponse"
        institution:
          $ref: "#/components/schemas/InstitutionSummaryResponse"
        expiresAt:
          type: string
          format: date-time
          description: |
            Instante UTC (RFC 3339) de expiração da evidência institucional: 120 dias
            após o início das consultas institucionais. Não é a expiração do token
            Firebase e não substitui a validação no servidor. A resposta não inclui
            um campo ttl separado.
    InstitutionSummaryResponse:
      type: object
      description: |
        Resumo público da instituição identificada na verificação institucional.
        Os dados vêm do cadastro do CApp; tenant e grupo Microsoft não são expostos.
        Sua presença não comprova vínculo estudantil nem concede permissões.
      required: [id, name, acronym]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da instituição no CApp; não é o tenant Microsoft.
        name:
          type: string
          description: Nome da instituição registrado no cadastro do CApp.
        acronym:
          type: [string, "null"]
          description: Sigla cadastrada, como UnB; o campo é retornado como null quando ausente.
    InstitutionalIdentityResponse:
      type: object
      required: [microsoftObjectId, name, affiliation]
      properties:
        microsoftObjectId:
          type: string
          format: uuid
          description: Identificador de objeto Microsoft validado como UUID; não é o UID Firebase nem um ID interno do CApp.
          examples: ["00000000-0000-0000-0000-000000000001"]
        name:
          type: [string, "null"]
          description: displayName fornecido pela instituição, ou null se ausente.
        affiliation:
          $ref: "#/components/schemas/InstitutionalAffiliation"
    InstitutionalAffiliation:
      description: Vínculo estudantil exige participação no grupo configurado e curso não vazio obtido no Graph. A ausência de qualquer um permite apenas acesso limitado.
      oneOf:
        - $ref: "#/components/schemas/StudentAffiliation"
        - $ref: "#/components/schemas/NonStudentAffiliation"
      discriminator:
        propertyName: type
        mapping:
          student: "#/components/schemas/StudentAffiliation"
          nonStudent: "#/components/schemas/NonStudentAffiliation"
    StudentAffiliation:
      type: object
      additionalProperties: false
      required: [type, courseName]
      properties:
        type:
          type: string
          const: student
        courseName:
          type: string
          minLength: 1
          pattern: '\S'
          description: Curso não vazio retornado pelo Graph para integrante do grupo estudantil; ainda sem associação ao catálogo interno de cursos.
    NonStudentAffiliation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: nonStudent
          description: Grupo estudantil não confirmado ou curso ausente, nulo ou em branco no Graph. Permite entrada limitada, sem direitos de estudante em nenhum CA. courseName não é retornado.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorDetails"
    ApiErrorDetails:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Identificador estável para tratamento programático; os códigos aplicáveis estão descritos em cada resposta HTTP.
        message:
          type: string
          description: Mensagem pública legível, sem diagnósticos internos ou credenciais.
        details:
          description: Contexto público adicional ou null. Os erros atuais da rota de verificação retornam null.
