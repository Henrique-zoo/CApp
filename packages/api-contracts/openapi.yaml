            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000020"
      responses:
        "200":
          description: Linha do tempo de comentários recuperada com sucesso em ordem cronológica.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemandCommentResponse"
              examples:
