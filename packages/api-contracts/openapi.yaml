                  title: Revisão de pré-requisitos de disciplina
                  description: Solicitação de ajuste nos pré-requisitos para viabilizar matrículas no fluxo padrão.
                  category: Pedagógico
                  courseName: Ciência da Computação
      responses:
        "201":
          description: Demanda criada com sucesso e status inicial 'open' registrado no histórico.
          content:
            application/json:
              schema:
