    post:
      operationId: createFaqEntry
      tags: [FAQ]
      summary: Cadastrar nova pergunta e resposta de FAQ do Centro Acadêmico
      description: |
        Registra uma nova pergunta e resposta no banco de conhecimento do Centro Acadêmico.
        Apenas membros com cargo de gestão ativo no Centro Acadêmico possuem autorização
        para criar entradas de FAQ (retornando `user_not_permitted_in_ca` caso o usuário
        não tenha permissão). O Centro Acadêmico deve existir e estar ativo.
      security:
        - FirebaseIdToken: []
          FirebaseAppCheck: []
      parameters:
        - name: academic_center_id
          in: path
          required: true
          description: Identificador único (UUID) do Centro Acadêmico.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
      requestBody:
        required: true
        description: Dados da pergunta e resposta a serem cadastradas no FAQ do Centro Acadêmico.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFaqEntryRequest"
            examples:
              faqEntryWithCategory:
                summary: Pergunta e resposta com categoria
                value:
                  question: Como solicito a carteirinha de estudante do CA?
                  answer: A carteirinha de estudante pode ser solicitada diretamente no balcão de atendimento do CA ou pelo formulário online disponível no início de cada semestre letivo.
                  category: Carteirinhas
              faqEntryWithoutCategory:
                summary: Pergunta e resposta sem categoria
                value:
                  question: Onde fica a sala de estudos do Centro Acadêmico?
                  answer: Nossa sala de estudos fica localizada no Bloco B do campus universitário, aberta nos turnos matutino e vespertino para todos os alunos.
      responses:
        "201":
          description: Pergunta e resposta de FAQ cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaqEntryResponse"
              examples:
                createdFaqEntry:
                  summary: Entrada de FAQ cadastrada com sucesso
                  value:
                    id: "00000000-0000-0000-0000-000000000010"
                    academicCenterId: "00000000-0000-0000-0000-000000000001"
                    question: Como solicito a carteirinha de estudante do CA?
                    answer: A carteirinha de estudante pode ser solicitada diretamente no balcão de atendimento do CA ou pelo formulário online disponível no início de cada semestre letivo.
                    category: Carteirinhas
                    createdBy: "00000000-0000-0000-0000-000000000020"
                    updatedBy: "00000000-0000-0000-0000-000000000020"
                    createdAt: "2026-11-22T13:00:00Z"
                    updatedAt: "2026-11-22T13:00:00Z"
        "400":
          description: |
            bad_request — JSON ausente, malformado ou campos com tipos incompatíveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Requisição inválida
                  details: null
        "401":
          $ref: "#/components/responses/InvalidAccountCredential"
        "403":
          description: |
            user_not_permitted_in_ca — Usuário sem cargo de gestão ativo no Centro Acadêmico;
            app_check_required ou app_check_invalid — Comprovação do aplicativo ausente ou recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                userNotPermitted:
                  summary: Usuário sem permissão de gestão no Centro Acadêmico
                  value:
                    error:
                      code: user_not_permitted_in_ca
                      message: Usuário sem permissão para cadastrar FAQ neste Centro Acadêmico
                      details: null
        "404":
          description: |
            academic_center_not_found — Centro Acadêmico não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                academicCenterNotFound:
                  summary: Centro Acadêmico não encontrado
                  value:
                    error:
                      code: academic_center_not_found
                      message: Centro Acadêmico '00000000-0000-0000-0000-000000000001' não encontrado
                      details:
                        academic_center_id: "00000000-0000-0000-0000-000000000001"
        "422":
          description: |
            academic_center_inactive — Centro Acadêmico inativo ou arquivado;
            empty_question — Texto da pergunta vazio ou contendo apenas espaços em branco;
            question_too_long — Texto da pergunta excede 500 caracteres;
            empty_answer — Resposta vazia ou contendo apenas espaços em branco;
            answer_too_long — Resposta excede 5000 caracteres;
            empty_category — Categoria informada mas vazia após aparo;
            category_too_long — Categoria excede 100 caracteres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                academicCenterInactive:
                  summary: Centro Acadêmico inativo
                  value:
                    error:
                      code: academic_center_inactive
                      message: Centro Acadêmico '00000000-0000-0000-0000-000000000001' não está ativo
                      details:
                        academic_center_id: "00000000-0000-0000-0000-000000000001"
                emptyQuestion:
                  summary: Pergunta vazia
                  value:
