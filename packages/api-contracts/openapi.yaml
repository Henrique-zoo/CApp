          format: uuid
          description: Identificador único estável do comentário.
        demandId:
          type: string
          format: uuid
          description: Identificador da demanda a que pertence.
        authorId:
          type: string
          format: uuid
          description: Identificador do usuário autor do comentário.
        authorRole:
          type: string
