        Acadêmico possuem permissão para visualizar as interações. Usuários sem
        permissão têm a solicitação rejeitada com HTTP 403 (`user_not_permitted_in_ca`).

        Os comentários são retornados em ordem cronológica ascendente (`createdAt ASC, id ASC`).
