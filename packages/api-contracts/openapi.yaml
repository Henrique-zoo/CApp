          description: Papel explícito do autor no momento da interação.
        content:
          type: string
          maxLength: 2000
          description: Conteúdo textual do comentário.
        createdAt:
          type: string
          format: date-time
          description: Instante UTC de publicação do comentário.
    DemandNotificationResponse:
      type: object
