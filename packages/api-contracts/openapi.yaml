                  value:
                    id: "00000000-0000-0000-0000-000000000020"
                    academicCenterId: "00000000-0000-0000-0000-000000000001"
                    authorId: "00000000-0000-0000-0000-000000000010"
                    forum: physical_space
                    title: Reparo do ar-condicionado
                    description: O ar-condicionado da sala de estudos não está refrigerando adequadamente.
                    category: Infraestrutura
                    courseName: null
                    status: open
                    createdAt: "2026-11-20T12:00:00Z"
                    updatedAt: "2026-11-20T12:00:00Z"
                createdInstitutionalDemand:
                  summary: Demanda institucional criada
                  value:
                    id: "00000000-0000-0000-0000-000000000021"
                    academicCenterId: "00000000-0000-0000-0000-000000000001"
                    authorId: "00000000-0000-0000-0000-000000000010"
                    forum: institutional
                    title: Revisão de pré-requisitos de disciplina
                    description: Solicitação de ajuste nos pré-requisitos para viabilizar matrículas no fluxo padrão.
                    category: Pedagógico
                    courseName: Ciência da Computação
                    status: open
                    createdAt: "2026-11-20T12:00:00Z"
                    updatedAt: "2026-11-20T12:00:00Z"
        "400":
          description: |
            bad_request — JSON ausente, malformado, de tipo incompatível ou excedendo o limite de tamanho do corpo.
            invalid_forum — fórum desconhecido (deve ser 'institutional' ou 'physical_space').
            invalid_demand — dados gerais da demanda rejeitados pelo domínio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                badRequest:
                  value:
                    error:
                      code: bad_request
                      message: Requisição inválida
                      details: null
                invalidForum:
                  value:
                    error:
                      code: invalid_forum
                      message: Fórum de demanda inválido
                      details: null
        "401":
          description: |
            Credenciais ausentes ou inválidas. Códigos possíveis:
            - unauthorized: cabeçalho Authorization ausente, repetido ou formato Bearer malformado;
            - invalid_token: credencial rejeitada pelo verificador de identidade;
            - expired_token: token de autenticação expirado.
          headers:
            WWW-Authenticate:
              description: Desafio Bearer incluído em todas as respostas 401.
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missingCredentials:
                  value:
                    error:
                      code: unauthorized
                      message: Autenticação necessária
                      details: null
        "403":
          description: |
            Acesso negado. Possíveis códigos:
            - student_membership_required: autor não possui vínculo estudantil ativo na instituição do CA;
            - user_not_permitted_in_ca: estudante pertence a curso não atendido pelo CA e não integra a gestão;
            - user_not_found: usuário não encontrado na base de dados interna;
            - forbidden: authorId informado no corpo diverge da credencial autenticada;
            - app_check_required / app_check_invalid: comprovação do aplicativo ausente ou recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                studentMembershipRequired:
                  value:
                    error:
                      code: student_membership_required
                      message: Vínculo estudantil ativo é obrigatório para registrar demandas
                      details: null
                userNotPermittedInCa:
                  value:
                    error:
                      code: user_not_permitted_in_ca
                      message: Usuário sem permissão para criar demandas neste Centro Acadêmico
                      details: null
        "404":
          description: |
            academic_center_not_found — Centro Acadêmico informado não foi encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: academic_center_not_found
                  message: Centro Acadêmico não encontrado
                  details:
                    academic_center_id: "00000000-0000-0000-0000-000000000001"
        "422":
          description: |
            Violação de regras de validação e restrições de negócio da demanda. Possíveis códigos:
            - academic_center_inactive: Centro Acadêmico encontra-se desativado/arquivado;
            - course_name_required: demandas do fórum institucional exigem curso associado;
            - course_not_represented_by_ca: curso informado não é representado pelo Centro Acadêmico;
            - course_not_allowed_for_physical_space: demandas de espaço físico não permitem curso;
            - empty_description / description_too_long: descrição vazia ou superior a 2000 caracteres;
            - empty_title / title_too_long: título vazio ou superior a 200 caracteres;
            - empty_category / category_too_long: categoria vazia ou superior a 100 caracteres;
            - empty_course_name / course_name_too_long: curso vazio ou superior a 200 caracteres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                courseNameRequired:
                  value:
                    error:
                      code: course_name_required
                      message: Demandas do fórum institucional exigem associação válida a um curso
                      details: null
                courseNotAllowedForPhysicalSpace:
                  value:
                    error:
                      code: course_not_allowed_for_physical_space
                      message: Demandas de espaço físico não permitem associação a curso
                      details: null
                courseNotRepresented:
                  value:
                    error:
                      code: course_not_represented_by_ca
                      message: O curso informado não é representado pelo Centro Acadêmico
                      details:
                        academic_center_id: "00000000-0000-0000-0000-000000000001"
                        course_name: "Engenharia Mecânica"
                emptyDescription:
                  value:
                    error:
                      code: empty_description
                      message: A descrição da demanda não pode ser vazia
                      details: null
        "500":
          $ref: "#/components/responses/AccountInternalError"
        "503":
          $ref: "#/components/responses/AccountServiceUnavailable"

components:
  parameters:
    ElectionId:
      in: path
      name: id
      required: true
      description: UUID não nulo da eleição, conforme publicado no manifesto.
      schema:
        type: string
        format: uuid
  responses:
    ElectionAuthorityAssignment:
      description: Designação confirmada da própria conta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ElectionAuthorityAssignment"
    ElectionRegistration:
      description: Cadastro e participação da conta autenticada nesta eleição.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ElectionRegistrationStatus"
    RegistrationNotFound:
      description: Eleição desconhecida ou conta interna ainda não provisionada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BoardNotFound:
      description: A eleição ainda não possui quadro publicado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidAccountCredential:
      description: Credencial Firebase ausente, inválida, expirada ou identidade divergente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountAccessDenied:
      description: app_check_required, app_check_invalid, institutional_verification_required ou account_inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountInternalError:
      description: Falha interna; nenhum diagnóstico ou credencial é exposto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountServiceUnavailable:
      description: app_check_unavailable, serviço indisponível ou timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    FirebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: |
        JWT Firebase App Check emitido para um App ID permitido do mesmo projeto.
        Nas rotas autenticadas, envie exatamente um cabeçalho. A ausência retorna
        403 com app_check_required. Um cabeçalho duplicado ou um JWT recusado
        retorna 403 com app_check_invalid.
        O SDK troca o token de depuração do Console pelo JWT exigido pela API.
        Saúde, prontidão, quadro eleitoral, checkpoint e apuração são públicos.
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token do projeto configurado no backend, com identidade
        microsoft.com vinculada. Enviar um único Authorization: Bearer <ID_TOKEN>.
        O access token Microsoft é enviado separadamente no corpo da verificação.
  schemas:
    RecordedBallot:
      $ref: "./elections/schemas.json#/$defs/RecordedBallot"
    ElectionRegistrationProof:
      $ref: "./elections/registration-request.schema.json"
    ElectionRegistrationStatus:
      $ref: "./elections/schemas.json#/$defs/VoterRegistrationStatus"
    ElectionPeriod:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
    ElectionPeriodChange:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, reason]
      properties:
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Pode ser adiado antes da abertura. Após abrir, preserve o início vigente.
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Deve ser posterior ao encerramento vigente.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionCancellation:
      type: object
      additionalProperties: false
      required: [cancelledAt, cancelledBy, reason]
      properties:
        cancelledAt:
          type: string
          format: date-time
        cancelledBy:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ElectionAuthorityAssignment:
      type: object
      additionalProperties: false
      required: [authorityId, role, slateId, registered, startsAt, endsAt, cancelled, manifestHash]
      properties:
        authorityId:
          $ref: "./elections/schemas.json#/$defs/Uuid"
        role:
          enum: [commission, slate]
        slateId:
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/Uuid"
            - type: "null"
        registered:
          type: boolean
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
        cancelled:
          type: boolean
        manifestHash:
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/Hash"
            - type: "null"
    SignedAuthorityRegistration:
      $ref: "./elections/schemas.json#/$defs/SignedAuthorityRegistration"
    SignedShare:
      $ref: "./elections/schemas.json#/$defs/SignedDecryptionShare"
    SignedTallyResult:
      $ref: "./elections/schemas.json#/$defs/SignedResult"
    ElectionTally:
      type: object
      additionalProperties: false
      required: [shares, result]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/SignedShare"
        result:
          description: Resultado assinado. Nulo enquanto nenhuma autoridade contribuiu.
          anyOf:
            - $ref: "#/components/schemas/SignedTallyResult"
            - type: "null"
    ElectionBoardSnapshot:
      type: object
      additionalProperties: false
      required: [manifest, startsAt, endsAt, entries, checkpoint, closure, aggregate]
      properties:
        manifest:
          $ref: "./elections/schemas.json#/$defs/SignedManifest"
        startsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Início do período de votação vigente informado pela eleição.
        endsAt:
          $ref: "./elections/schemas.json#/$defs/Time"
          description: Fim do período de votação vigente informado pela eleição.
        entries:
          type: array
          items:
            $ref: "./elections/schemas.json#/$defs/SignedBoardEntry"
        checkpoint:
          description: Último recibo confirmado. Nulo antes do primeiro voto.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedReceipt"
            - type: "null"
        closure:
          description: Termo assinado ao encerrar a votação.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedClosure"
            - type: "null"
        aggregate:
          description: Produto das cifras vinculado ao termo de encerramento.
          anyOf:
            - $ref: "./elections/schemas.json#/$defs/SignedAggregate"
            - type: "null"
        cancellation:
          $ref: "#/components/schemas/ElectionCancellation"
    InternalUserResponse:
      type: object
      required: [id, status, nickname, email, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Nome declarado para uma ausência do Graph; não é evidência institucional.
        id:
          type: string
          format: uuid
          description: ID interno estável, compartilhado entre os provedores vinculados no Firebase.
        status:
          type: string
          enum: [incomplete, active, inactive]
        nickname:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
          description: E-mail escolhido para a credencial interna; não é necessariamente institucional.
        currentSemester:
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
          description: Período atual do curso, independente do tempo desde o ingresso.
        institutionEntrySemester:
          type: [string, "null"]
          pattern: '^[0-9]{4}\.[12]$'
          description: Semestre de ingresso na instituição, como 2023.2.
      allOf:
        - if:
            properties:
              status:
                const: active
          then:
            properties:
              id: {}
              status: {}
              nickname:
                type: string
                pattern: '\S'
              email:
                type: string
                minLength: 1
              currentSemester:
                type: integer
              institutionEntrySemester:
                type: string
    InstitutionalAuthResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          $ref: "#/components/schemas/InstitutionalVerificationResponse"
        suggestedEmail:
          type: string
          format: email
          minLength: 1
          description: Sugestão transitória do Graph para o cadastro. Omitida se indisponível ou a conta não estiver Incomplete. Não integra a verificação nem os caches.
      allOf:
        - if:
            properties:
              user:
                properties:
                  status:
                    enum: [active, inactive]
          then:
            not:
              properties:
                suggestedEmail: {}
              required: [suggestedEmail]

    AccountSessionResponse:
      type: object
      required: [user, verification]
      properties:
        user:
          $ref: "#/components/schemas/InternalUserResponse"
        verification:
          oneOf:
            - $ref: "#/components/schemas/InstitutionalVerificationResponse"
            - type: "null"
    CompleteProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname, currentSemester, institutionEntrySemester]
      properties:
        name:
          type: [string, "null"]
          description: Complemento opcional, aceito somente se o nome do Graph for null.
        nickname:
          type: string
          minLength: 1
          pattern: '\S'
          description: Apelido obrigatório, aparado antes de persistir.
        currentSemester:
          type: integer
          minimum: 1
          maximum: 2147483647
        institutionEntrySemester:
          type: string
          pattern: '^[0-9]{4}\.[12]$'
    InstitutionalAuthRequest:
      type: object
      required: [microsoftAccessToken]
      properties:
        microsoftAccessToken:
          type: string
          minLength: 1
          writeOnly: true
          description: |
            Access token delegado para consultar organização, perfil e participação
            em grupos no Microsoft Graph. Não é um Firebase ID token. Strings vazias
            são rejeitadas; o backend não aplica trim antes de consultar o provedor.
    InstitutionalVerificationResponse:
      type: object
      required: [profile, institution, expiresAt]
      properties:
        profile:
          $ref: "#/components/schemas/InstitutionalIdentityResponse"
        institution:
          $ref: "#/components/schemas/InstitutionSummaryResponse"
        expiresAt:
          type: string
          format: date-time
          description: |
            Instante UTC (RFC 3339) de expiração da evidência institucional: 120 dias
            após o início das consultas institucionais. Não é a expiração do token
            Firebase e não substitui a validação no servidor. A resposta não inclui
            um campo ttl separado.
    InstitutionSummaryResponse:
      type: object
      description: |
        Resumo público da instituição identificada na verificação institucional.
        Os dados vêm do cadastro do CApp; tenant e grupo Microsoft não são expostos.
        Sua presença não comprova vínculo estudantil nem concede permissões.
      required: [id, name, acronym]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da instituição no CApp; não é o tenant Microsoft.
        name:
          type: string
          description: Nome da instituição registrado no cadastro do CApp.
        acronym:
          type: [string, "null"]
          description: Sigla cadastrada, como UnB; o campo é retornado como null quando ausente.
    InstitutionalIdentityResponse:
      type: object
      required: [microsoftObjectId, name, affiliation]
      properties:
        microsoftObjectId:
          type: string
          format: uuid
          description: Identificador de objeto Microsoft validado como UUID; não é o UID Firebase nem um ID interno do CApp.
          examples: ["00000000-0000-0000-0000-000000000001"]
        name:
          type: [string, "null"]
          description: displayName fornecido pela instituição, ou null se ausente.
        affiliation:
          $ref: "#/components/schemas/InstitutionalAffiliation"
    InstitutionalAffiliation:
      description: Vínculo estudantil exige participação no grupo configurado e curso não vazio obtido no Graph. A ausência de qualquer um permite apenas acesso limitado.
      oneOf:
        - $ref: "#/components/schemas/StudentAffiliation"
        - $ref: "#/components/schemas/NonStudentAffiliation"
      discriminator:
        propertyName: type
        mapping:
          student: "#/components/schemas/StudentAffiliation"
          nonStudent: "#/components/schemas/NonStudentAffiliation"
    StudentAffiliation:
      type: object
      additionalProperties: false
      required: [type, courseName]
      properties:
        type:
          type: string
          const: student
        courseName:
          type: string
          minLength: 1
          pattern: '\S'
          description: Curso não vazio retornado pelo Graph para integrante do grupo estudantil; ainda sem associação ao catálogo interno de cursos.
    NonStudentAffiliation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: nonStudent
          description: Grupo estudantil não confirmado ou curso ausente, nulo ou em branco no Graph. Permite entrada limitada, sem direitos de estudante em nenhum CA. courseName não é retornado.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorDetails"
    ApiErrorDetails:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Identificador estável para tratamento programático; os códigos aplicáveis estão descritos em cada resposta HTTP.
        message:
          type: string
          description: Mensagem pública legível, sem diagnósticos internos ou credenciais.
        details:
          description: Contexto público adicional ou null. Os erros atuais da rota de verificação retornam null.
    ConfigureInitialMandateRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          description: Data de início do mandato da gestão (AAAA-MM-DD).
          example: "2026-01-01"
        endDate:
          type: string
          format: date
          description: Data de término do mandato da gestão (AAAA-MM-DD). Deve ser estritamente posterior à data de início.
          example: "2026-12-31"
        title:
          type: [string, "null"]
          description: Título ou nome opcional da chapa ou gestão.
          example: "Gestão 2026-2027"
    MandateResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - academicCenterId
        - createdById
        - startDate
        - endDate
        - status
        - durationInDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do mandato.
          example: "018f0000-0000-7000-8000-000000000001"
        academicCenterId:
          type: string
          format: uuid
          description: Identificador do Centro Acadêmico correspondente.
          example: "018f0000-0000-7000-8000-000000000002"
        createdById:
          type: string
          format: uuid
          description: Identificador do usuário que registrou a configuração inicial do mandato.
          example: "018f0000-0000-7000-8000-000000000003"
        title:
          type: [string, "null"]
          description: Título ou nome da chapa/gestão.
          example: "Gestão 2026-2027"
        startDate:
          type: string
          format: date
          description: Data de início do período do mandato (AAAA-MM-DD).
          example: "2026-01-01"
        endDate:
          type: string
          format: date
          description: Data de término do período do mandato (AAAA-MM-DD).
          example: "2026-12-31"
        status:
          type: string
          enum: [active, concluded, archived]
          description: Situação do mandato no ciclo de vida da gestão.
          example: "active"
        durationInDays:
          type: integer
          description: Duração total do mandato calculada em dias a partir das datas persistidas.
          example: 364
        createdAt:
          type: string
          format: date-time
          description: Instante UTC em que a configuração do mandato foi registrada.
          example: "2026-11-22T14:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Instante UTC da última modificação do registro.
          example: "2026-11-22T14:00:00Z"
    CreateDemandRequest:
      type: object
      additionalProperties: false
      required: [forum, description]
      properties:
        forum:
          type: string
          enum: [institutional, physical_space]
          description: Fórum alvo da demanda (`institutional` ou `physical_space`).
        title:
          type: [string, "null"]
          maxLength: 200
          description: Título ou resumo identificador opcional da demanda.
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: Conteúdo ou descrição detalhada da demanda.
        category:
          type: [string, "null"]
          maxLength: 100
          description: Categoria temática opcional.
        courseName:
          type: [string, "null"]
          maxLength: 200
          description: Nome do curso associado (obrigatório em fórum institucional, proibido em espaço físico).
        authorId:
          type: [string, "null"]
          format: uuid
          description: Identificador opcional do autor; se informado, deve coincidir com o usuário autenticado.
    DemandResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - academicCenterId
        - authorId
        - forum
        - description
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único estável da demanda.
        academicCenterId:
          type: string
          format: uuid
          description: Identificador do Centro Acadêmico responsável.
        authorId:
          type: string
          format: uuid
          description: Identificador do usuário autor da demanda.
        forum:
          type: string
          enum: [institutional, physical_space]
          description: Fórum ao qual a demanda pertence.
        title:
          type: [string, "null"]
          maxLength: 200
          description: Título ou resumo identificador da demanda, se houver.
        description:
          type: string
          maxLength: 2000
          description: Descrição detalhada do problema ou necessidade comunicada.
        category:
          type: [string, "null"]
          maxLength: 100
          description: Categoria temática, se informada.
        courseName:
          type: [string, "null"]
          maxLength: 200
          description: Curso associado à demanda (presente somente em demandas institucionais).
        status:
          type: string
          enum:
            - open
            - in_analysis
            - rejected
            - forwarded_to_coordination
            - in_execution
            - resolved
            - cancelled
            - completed
          description: Status atual da demanda no ciclo de vida.
        createdAt:
          type: string
          format: date-time
          description: Instante UTC de registro da demanda.
        updatedAt:
          type: string
          format: date-time
          description: Instante UTC da última modificação da demanda.
