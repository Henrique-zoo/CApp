# Exceções intencionais da validação Redocly.
# As regras continuam ativas para os demais pontos do contrato.

openapi.yaml:
  no-empty-servers:
    # O projeto ainda não definiu uma URL canônica de implantação.
    # Não usamos localhost nem um endereço fictício como servidor da API.
    - '#/openapi'

  info-license:
    # A licença do projeto ainda não foi formalmente definida.
    # A exceção deve ser removida quando essa decisão for tomada.
    - '#/info'

  operation-4xx-response:
    # GET /health não recebe parâmetros e retorna 200 quando o processo está saudável.
    - '#/paths/~1health/get/responses'

    # GET /ready retorna 200 ou 503 conforme a disponibilidade do PostgreSQL.
    # Não existe entrada do cliente que justifique uma resposta 4XX.
    - '#/paths/~1ready/get/responses'
