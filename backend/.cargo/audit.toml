# Configuração do cargo-audit para o backend CApp
# Base de dados: RustSec Advisory Database (https://rustsec.org)

[advisories]
# Lista de IDs de advisories a serem ignorados temporariamente (com justificativa formal na política)
ignore = []

# Avisos informativos a serem monitorados
informational_warnings = ["unmaintained", "unsound"]

# Limiar de severidade mínima para falha (none | low | medium | high | critical)
severity_threshold = "low"

[database]
# Repositório oficial de advisories da comunidade RustSec
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
# Trata pacotes descontinuados/unmaintained como erro
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
# Alertar quando houver pacotes yanked (removidos) do crates.io
enabled = true
update_index = true
