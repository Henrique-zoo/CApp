name: API Contracts CI

on:
  push:
    paths:
      - "packages/api-contracts/**"
      - "backend/src/modules/**/api/**"
      - "backend/src/api/**"
      - ".oasdiff-err-ignore.txt"
      - ".oasdiff.yaml"
      - ".oasdiff-levels.txt"
      - ".redocly.lint-ignore.yaml"
      - ".github/workflows/api-contracts.yml"
  pull_request:
    paths:
      - "packages/api-contracts/**"
      - "backend/src/modules/**/api/**"
      - "backend/src/api/**"
      - ".oasdiff-err-ignore.txt"
      - ".oasdiff.yaml"
      - ".oasdiff-levels.txt"
      - ".redocly.lint-ignore.yaml"
      - ".github/workflows/api-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and check compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared JSON examples
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          spec = Path("packages/api-contracts/openapi.yaml")
          content = spec.read_text(encoding="utf-8")
          references = re.findall(
              r'^\s*externalValue:\s*(\S+)\s*$',
              content,
              flags=re.MULTILINE,
          )

          if not references:
              raise SystemExit("Nenhuma referência externalValue encontrada.")

          root = spec.parent.resolve()

          for reference in references:
              if "://" in reference:
                  raise SystemExit(
                      f"Esperada referência local, encontrada URL externa: {reference}"
                  )

              example = (spec.parent / reference).resolve()

              try:
                  example.relative_to(root)
              except ValueError:
                  raise SystemExit(
                      f"Referência aponta para fora de packages/api-contracts: {reference}"
                  )

              if not example.is_file():
                  raise SystemExit(f"Exemplo não encontrado: {reference}")

              with example.open(encoding="utf-8") as file:
                  json.load(file)

              print(f"OK: {reference}")

          print(f"\n{len(references)} exemplos externos válidos.")
          PY

      - name: Lint OpenAPI description
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/spec" \
            -w /spec \
            redocly/cli:2.73.0 \
            lint packages/api-contracts/openapi.yaml --format=github-actions

      - name: Fetch target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Require OpenAPI update for backend API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES="$(git diff --name-only "origin/${BASE_REF}" HEAD)"
          API_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^backend/src/api/.*\.rs$|^backend/src/modules/.*/api/.*\.rs$' | grep -v '/tests\.rs$' || true)"

          if [ -n "$API_FILES" ] &&
             ! printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'packages/api-contracts/openapi.yaml'; then
            echo "::error::Alterações na implementação HTTP do backend exigem atualização de packages/api-contracts/openapi.yaml no mesmo PR."
            echo "$API_FILES"
            exit 1
          fi

      - name: Detect breaking changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: "origin/${{ github.base_ref }}:packages/api-contracts/openapi.yaml"
          revision: "HEAD:packages/api-contracts/openapi.yaml"
          review: false
